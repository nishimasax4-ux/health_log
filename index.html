function handleEditSave() {
  if (editing.kind === "training") {
    const e = entries.find(x => x.id === editing.id);
    e.date = document.getElementById("edit-date").value || e.date;
    if (e.type === "strength") {
      e.part = editing.tempPart;
      e.exercise = document.getElementById("edit-exercise").value.trim();
      const reps = Number(document.getElementById("edit-reps").value);
      const weight = Number(document.getElementById("edit-weight").value);
      if (reps > 0) e.reps = reps;
      if (weight > 0) e.weight = weight;
    } else {
      const ex = document.getElementById("edit-exercise").value.trim();
      if (ex) e.exercise = ex;
      const minutes = Number(document.getElementById("edit-minutes").value);
      if (minutes > 0) e.minutes = minutes;
      // この編集フォームには歩数・距離の欄が無いため、手で時間を直接編集したら
      // 歩数・距離由来の参考情報(何歩・何kmだったか)は古くなる。表示が食い違わないよう消しておく。
      delete e.steps; delete e.distanceKm;
    }
  } else if (editing.kind === "weight") {
    const w = weightEntries.find(x => x.date === editing.date);
    const newDate = document.getElementById("edit-date").value || w.date;
    const newVal = parseFloat(document.getElementById("edit-weight").value);
    if (newVal > 0) {
      const bfEl = document.getElementById("edit-bodyfat");
      const bfRaw = bfEl ? parseFloat(bfEl.value) : NaN;
      const waistEl = document.getElementById("edit-waist");
      const waistRaw = waistEl ? parseFloat(waistEl.value) : NaN;
      weightEntries = weightEntries.filter(x => x.date !== editing.date && x.date !== newDate);
      const rec = { date: newDate, weight: newVal };
      if (Number.isFinite(bfRaw) && bfRaw >= BODYFAT_MIN && bfRaw <= BODYFAT_MAX) rec.bodyFat = Math.round(bfRaw * 10) / 10;
      if (Number.isFinite(waistRaw) && waistRaw >= WAIST_MIN && waistRaw <= WAIST_MAX) rec.waist = Math.round(waistRaw * 10) / 10;
      weightEntries.unshift(rec);
    }
  } else if (editing.kind === "meal") {
    const m = mealEntries.find(x => x.id === editing.id);
    m.date = document.getElementById("edit-date").value || m.date;
    m.mealType = editing.tempMealType;
    const text = document.getElementById("edit-text").value.trim();
    if (text) m.text = text;
    const cal = document.getElementById("edit-calories").value;
    m.calories = cal ? Number(cal) : null;
    m.protein = Number(document.getElementById("edit-protein").value) || 0;
    m.fat = Number(document.getElementById("edit-fat").value) || 0;
    m.carb = Number(document.getElementById("edit-carb").value) || 0;
  } else if (editing.kind === "exercise-master") {
    const x = exerciseMaster.find(i => i.id === editing.id);
    if (x) {
      const name = document.getElementById("edit-master-name").value.trim();
      if (name) x.name = name;
      x.part = editing.tempPart;
    }
  } else if (editing.kind === "meal-master") {
    const m = mealMaster.find(i => i.id === editing.id);
    if (m) {
      const name = document.getElementById("edit-master-name").value.trim();
      if (name) m.name = name;
      const cal = document.getElementById("edit-calories").value;
      m.calories = cal ? Number(cal) : null;
      m.protein = Number(document.getElementById("edit-protein").value) || 0;
      m.fat = Number(document.getElementById("edit-fat").value) || 0;
      m.carb = Number(document.getElementById("edit-carb").value) || 0;
    }
  }
  const wasMasterEdit = editing.kind === "exercise-master" || editing.kind === "meal-master";
  const wasExerciseMaster = editing.kind === "exercise-master";
  editing = null;
  saveState();
  // マスタ登録の編集は、種目マスタ・食事マスタの各一覧のみを更新すれば十分
  // (add/del-*-masterと同じ扱い。運動・食事の「記録」そのものではないため
  // renderTabContent()による全体再描画は行わない)。
  if (wasMasterEdit) { wasExerciseMaster ? renderMasterExerciseSection() : renderMasterMealList(); renderEditModal(); }
  else { renderTabContent(); renderEditModal(); }
}

function handleAddTraining() {
  const date = document.getElementById("date-input").value || localDateStr();
  if (trainingSubTab === "strength") {
    const reps = document.getElementById("reps-input").value;
    if (!reps) return;
    const exercise = document.getElementById("exercise-input").value.trim();
    const weight = Number(document.getElementById("weight-input").value) || 0;
    entries.unshift({
      id: uid(), date, type: "strength", createdAt: Date.now(),
      part: selectedPart, exercise, reps: Number(reps), weight,
    });
    // 次回この種目(または部位)を選んだときに、今回の回数・負荷を提案できるよう覚えておく。
    lastStrengthByExercise[exercise || `(${selectedPart})`] = { reps: Number(reps), weight };
  } else if (trainingSubTab === "cardio") {
    const minutes = document.getElementById("minutes-input").value;
    if (!minutes) return;
    // 歩数モード(v1.9): 歩数と、その時点の換算距離を記録に添えておく(履歴に「6,000歩・
    // 4.6km」のように表示するための参考情報。カロリー計算自体は他と同じくminutesを使う)。
    // 距離モード(v1.11): 入力した距離をそのまま実測値として記録に添える(歩数モードと違い、
    // 距離そのものが入力値なので変換は不要)。
    let stepsMeta = {};
    if (cardioInputMode === "steps") {
      const stepsVal = Number(document.getElementById("steps-input").value) || 0;
      if (stepsVal > 0) {
        const heightCm = profile ? profile.height : null;
        stepsMeta = { steps: stepsVal, distanceKm: Math.round(walkStatsFromSteps_(stepsVal, heightCm).distanceKm * 100) / 100 };
      }
    } else if (cardioInputMode === "distance") {
      const distVal = Number(document.getElementById("distance-input").value) || 0;
      if (distVal > 0) stepsMeta = { distanceKm: Math.round(distVal * 100) / 100 };
    }
    const customVal = document.getElementById("cardio-custom-input").value.trim();
    if (selectedCardio === "その他" && !customVal) return;
    const exercise = selectedCardio === "その他" ? customVal : selectedCardio;
    entries.unshift({
      id: uid(), date, type: "cardio", createdAt: Date.now(),
      exercise, minutes: Number(minutes), ...stepsMeta,
    });
    // 次回同じ種目を選んだときに、今回の時間を提案できるよう覚えておく。
    lastCardioMinutes[selectedCardio === "その他" ? customVal : selectedCardio] = Number(minutes);
  } else {
    const minutes = document.getElementById("housework-minutes-input").value;
    if (!minutes) return;
    const customVal = document.getElementById("housework-custom-input").value.trim();
    if (selectedHousework === "その他" && !customVal) return;
    const exercise = selectedHousework === "その他" ? customVal : selectedHousework;
    entries.unshift({
      id: uid(), date, type: "housework", createdAt: Date.now(),
      exercise, minutes: Number(minutes),
    });
    // 次回同じ内容を選んだときに、今回の時間を提案できるよう覚えておく。
    lastHouseworkMinutes[selectedHousework === "その他" ? customVal : selectedHousework] = Number(minutes);
  }
  // 記録し終わったら、次に記録しそうな種目(=いちばん使っている種目)に戻しておく。
  selectedCardio = defaultCardio();
  saveState(); renderTabContent();
}
function handleAddWeight() {
  const date = document.getElementById("weight-date-input").value || localDateStr();

// ============ ストレッチタブ(v1.7・v1.8で①タイマー②今日のおすすめ3つ③記録カレンダーを追加) ============
// STRETCH_ITEMSを日付ごとにチェックできるようにする。運動の記録(entries)とは
// 別に、その日チェック済みの項目IDだけをstretchLogに保存する。
function toggleStretchItem(date, itemId) {
  // チェック/解除した項目のタイマーが動いていたら、記録と食い違わないよう止める。
  if (stretchTimer && stretchTimer.itemId === itemId) stopStretchTimer();
  const done = new Set(stretchLog[date] || []);
  if (done.has(itemId)) done.delete(itemId); else done.add(itemId);
  stretchLog[date] = Array.from(done);
  saveState();
  renderTabContent();
}
// 「基本セット(core:trueの項目)が全部そろっている日」が今日から何日連続で続いているか。
// 今日がまだ未完了でも、昨日までの連続日数は途切れさせない(その日の終わりまでにチェックする
// 猶予を持たせる)。おすすめ項目(core:false)は連続記録の判定には含めない。
function stretchStreak() {
  let streak = 0;
  let d = new Date();
  const todayStr = localDateStr();
  const isCoreDone = (doneIds) => CORE_STRETCH_IDS.every(id => doneIds.includes(id));
  const todayDone = isCoreDone(stretchLog[todayStr] || []);
  if (!todayDone) d.setDate(d.getDate() - 1); // 今日未完了なら昨日から数える
  while (true) {
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const doneIds = stretchLog[key] || [];
    if (!isCoreDone(doneIds)) break;
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

// ---- ① ストレッチタイマー(v1.8) ----
// stretchTimerは「今の画面状態」であって記録データそのものではないため、localStorageには
// 保存しない。毎秒の更新は画面全体を再描画せず、カウントダウン表示のDOMだけを直接書き換える
// (全体再描画はチラつきや他操作との競合のもとになるため)。同じ項目が「今日のおすすめ」欄と
// 通常のリストの両方に出ていることがあるので、data-stretch-timer-display属性を持つ要素は
// querySelectorAllで全部まとめて更新する。
function startStretchTimer(itemId) {
  stopStretchTimer();
  const item = STRETCH_ITEMS.find(i => i.id === itemId);
  if (!item) return;
  stretchTimer = { itemId, remaining: item.timerSec, intervalId: null };
  renderTabContent(); // ボタン→カウントダウン表示への切り替えは、開始時だけ全体再描画する
  stretchTimer.intervalId = setInterval(() => {
    if (!stretchTimer || stretchTimer.itemId !== itemId) { clearInterval(stretchTimer && stretchTimer.intervalId); return; }
    stretchTimer.remaining--;
    if (stretchTimer.remaining > 0) {
      document.querySelectorAll(`[data-stretch-timer-display="${itemId}"]`).forEach(el => {
        el.textContent = `残り${stretchTimer.remaining}秒`;
      });
    } else {
      clearInterval(stretchTimer.intervalId);
      stretchTimer = null;
      playStretchTimerSound();
      if (navigator.vibrate) { try { navigator.vibrate([150, 80, 150]); } catch (e) {} }
      const today = localDateStr();
      const done = new Set(stretchLog[today] || []);
      done.add(itemId);
      stretchLog[today] = Array.from(done);
      saveState();
      renderTabContent();
    }
  }, 1000);
}
// 手動で止める場合・他の項目のタイマーを新しく始める場合・タブを離れる場合・画面がバック
// グラウンドに回った場合、のいずれでも呼ばれる。「離れている間もカウントが進み、戻ってきたら
// 勝手に完了扱いになっていた」という驚きを防ぐため、途中で止めても完了にはしない。
function stopStretchTimer() {
  if (stretchTimer && stretchTimer.intervalId) clearInterval(stretchTimer.intervalId);
  stretchTimer = null;
}
function playStretchTimerSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    o.start();
    o.stop(ctx.currentTime + 0.3);
    o.onended = () => ctx.close();
  } catch (e) { /* 音が出せない環境(自動再生制限など)では黙って無視する */ }
}
// 画面から離れた(他アプリに切り替えた・ロックした等)ときもタイマーを止める。
document.addEventListener("visibilitychange", () => {
  if (document.hidden && stretchTimer) {
    stopStretchTimer();
    if (activeTab === "stretch") renderTabContent();
  }
});

// ---- ② 今日のおすすめ3つ(v1.8) ----
// 「最後にやった日から一番経っている項目」を優先し、一度もやっていない項目は最優先(Infinity)。
// 同点(主に未実施どうし)は日付を種にした決定的なハッシュで並べ替える(Math.randomは使わない
// ―― 使うとリロードのたびにおすすめが変わってしまい、「今日のおすすめ」の一貫性が無くなる)。
function lastStretchDoneDate(itemId) {
  let last = null;
  Object.keys(stretchLog).forEach(d => {
    if ((stretchLog[d] || []).includes(itemId) && (!last || d > last)) last = d;
  });
  return last;
}
function daysSinceDateStr(dateStr) {
  const a = new Date(dateStr + "T00:00:00");
  const b = new Date(localDateStr() + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
function hashStr_(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return h;
}
function todaysStretchPicks() {
  const today = localDateStr();
  const doneToday = new Set(stretchLog[today] || []);
  const seed = today.split("-").join("");
  const scored = STRETCH_ITEMS.filter(i => !doneToday.has(i.id)).map(item => {
    const last = lastStretchDoneDate(item.id);
    const days = last ? daysSinceDateStr(last) : Infinity;
    return { item, days, hash: hashStr_(seed + item.id) };
  });
  scored.sort((a, b) => (b.days !== a.days) ? b.days - a.days : a.hash - b.hash);
  return scored.slice(0, 3).map(s => s.item);
}

// ---- ③ 記録カレンダー(v1.8) ----
// 表示中の月はstretchCalMonthという専用の状態で持ち、運動タブの履歴カレンダー(calMonth)
// とは共有しない(片方をめくるともう片方も動いてしまう、という事故を防ぐため)。
function stretchCalendarHtml() {
  const year = stretchCalMonth.getFullYear(), month = stretchCalMonth.getMonth();
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = localDateStr();
  let cells = "";
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell" style="visibility:hidden;"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const doneIds = stretchLog[dateStr] || [];
    const coreDone = CORE_STRETCH_IDS.filter(id => doneIds.includes(id)).length;
    const ratio = coreDone / CORE_STRETCH_IDS.length;
    let bg = "var(--paper)", fg = "";
    if (ratio >= 1) { bg = "var(--teal)"; fg = "color:#fff;"; }
    else if (ratio > 0.5) { bg = "var(--teal-soft)"; }
    else if (ratio > 0) { bg = "var(--line)"; }
    cells += `<div class="cal-cell ${dateStr === todayStr ? "today" : ""}" style="background:${bg};${fg}">
      <span>${d}</span>${doneIds.length ? `<span style="font-size:9px;">${doneIds.length}</span>` : ""}
    </div>`;
  }
  const weekHead = WEEKDAY.map(w => `<div style="text-align:center;font-size:10px;color:var(--ink-faint);">${w}</div>`).join("");
  return `
    <div class="between" style="margin-bottom:8px;">
      <button data-action="stretch-cal-prev" style="background:none;border:none;font-size:16px;padding:4px 10px;">‹</button>
      <span class="mono" style="font-weight:700;">${year}年${month + 1}月</span>
      <button data-action="stretch-cal-next" style="background:none;border:none;font-size:16px;padding:4px 10px;">›</button>
    </div>
    <div class="cal-grid" style="margin-bottom:4px;">${weekHead}</div>
    <div class="cal-grid">${cells}</div>
    <p class="muted" style="font-size:10.5px;margin:10px 0 0;line-height:1.6;">色の濃さは、その日の基本セット(${CORE_STRETCH_IDS.length}項目)の達成率です。濃い緑=全部達成、薄い緑=半分以上、グレー=一部のみ。</p>`;
}

// ⏱ タイマーの開始/カウントダウン表示ボタン(チェックボックスのlabelの外に置く。
// labelの中に別の操作可能要素を入れ子にするとHTML的に不正で、クリック時の挙動も
// 怪しくなるため)。
function stretchTimerButtonHtml(item) {
  const isActive = stretchTimer && stretchTimer.itemId === item.id;
  if (isActive) {
    return `<button class="chip" data-action="stop-stretch-timer" data-id="${esc(item.id)}" style="flex:0 0 auto;white-space:nowrap;color:var(--coral);border-color:var(--coral);">⏱ <span data-stretch-timer-display="${esc(item.id)}">残り${stretchTimer.remaining}秒</span>・止める</button>`;
  }
  return `<button class="chip" data-action="start-stretch-timer" data-id="${esc(item.id)}" style="flex:0 0 auto;white-space:nowrap;">⏱ ${item.timerSec}秒で開始</button>`;
}
// チェック項目1件ぶんの行(チェックボックス + 名前 + やり方 + タイマー)。基本セット・
// おすすめ・今日のおすすめ3つ、共通で使う。
function stretchItemRow(item, doneIds) {
  const done = doneIds.has(item.id);
  return `
    <div class="row" style="align-items:flex-start;gap:8px;margin-bottom:12px;">
      <label style="display:flex;align-items:flex-start;gap:8px;flex:1;min-width:0;cursor:pointer;">
        <input type="checkbox" data-action="toggle-stretch" data-id="${esc(item.id)}" ${done ? "checked" : ""} style="width:18px;height:18px;flex:0 0 auto;margin-top:2px;">
        <span style="display:block;min-width:0;">
          <span style="display:block;font-size:12.5px;font-weight:600;${done ? "text-decoration:line-through;color:var(--ink-faint);" : ""}">${esc(item.label)}</span>
          <span class="muted" style="display:block;font-size:11px;line-height:1.6;margin-top:2px;">${esc(item.how)}</span>
        </span>
      </label>
      ${stretchTimerButtonHtml(item)}
    </div>`;
}
function stretchHtml() {
  const today = localDateStr();
  const doneIds = new Set(stretchLog[today] || []);
  const coreItems = STRETCH_ITEMS.filter(i => i.core);
  const extraItems = STRETCH_ITEMS.filter(i => !i.core);
  const coreDoneCount = coreItems.filter(i => doneIds.has(i.id)).length;
  const coreTotal = coreItems.length;
  const allCoreDone = coreDoneCount === coreTotal;
  const streak = stretchStreak();
  const picks = todaysStretchPicks();

  // おすすめ項目をcategory(上半身/下半身/体幹・全身)ごとにグルーピングして表示する。
  const categories = [];
  extraItems.forEach(item => {
    let cat = categories.find(c => c.name === item.category);
    if (!cat) { cat = { name: item.category, items: [] }; categories.push(cat); }
    cat.items.push(item);
  });

  return `
    <div class="card">
      <p class="section-title" style="margin:0 0 6px;">🎯 今日のおすすめ3つ</p>
      ${picks.length === 0
        ? `<p class="muted" style="font-size:12px;margin:0;line-height:1.6;">🎉 今日はもう全種目チェック済みです。お疲れさまでした!</p>`
        : `<p class="muted" style="font-size:11px;margin:0 0 12px;line-height:1.6;">しばらくやっていない項目を中心に選びました。下の一覧と同じ項目なので、どちらからチェックしてもOKです。</p>
           ${picks.map(item => stretchItemRow(item, doneIds)).join("")}`}
    </div>

    <div class="card">
      <div class="between" style="margin-bottom:8px;">
        <p class="section-title" style="margin:0;">🧘 今日のストレッチ(基本セット)</p>
        <span class="muted" style="font-size:11.5px;">${coreDoneCount}/${coreTotal}${allCoreDone ? " ✅" : ""}</span>
      </div>
      ${streak > 0 ? `<p class="muted" style="font-size:11px;margin:0 0 8px;">🔥 基本セット全項目達成 ${streak}日連続</p>` : ""}
      <p class="muted" style="font-size:11px;margin:0 0 12px;line-height:1.6;">デスクワークで座りっぱなしになりやすい部位と、筋トレ後の回復ケアを踏まえた毎日の基本セットです。全部チェックすると連続記録がカウントされます。</p>
      ${coreItems.map(item => stretchItemRow(item, doneIds)).join("")}
    </div>

    <div class="card">
      <p class="section-title" style="margin:0 0 6px;">✨ 他にもやってみる(1人でできるおすすめ)</p>
      <p class="muted" style="font-size:11px;margin:0 0 14px;line-height:1.6;">道具や補助者なしで1人でできるストレッチです。基本セットに慣れてきたら、気になる部位を選んで取り入れてみましょう。チェックすると記録は残りますが、連続記録(streak)には影響しません。</p>
      ${categories.map(cat => `
        <p class="muted" style="font-size:11px;font-weight:700;margin:0 0 8px;">${esc(cat.name)}</p>
        ${cat.items.map(item => stretchItemRow(item, doneIds)).join("")}
      `).join("")}
    </div>

    <div class="card">
      <p class="section-title" style="margin:0 0 10px;">📅 記録カレンダー</p>
      ${stretchCalendarHtml()}
    </div>
`;
}

  else if (action === "toggle-history-day") {
    const d = t.dataset.date;
    if (trainingHistoryOpenDates.has(d)) trainingHistoryOpenDates.delete(d); else trainingHistoryOpenDates.add(d);
    renderHistory();
  }
  else if (action === "toggle-history-expand") { trainingHistoryExpanded = !trainingHistoryExpanded; renderHistory(); }
  else if (action === "toggle-distance-history") { distanceHistoryExpanded = !distanceHistoryExpanded; renderDistanceHistory(); }
  else if (action === "toggle-meal-history-day") {
    const d = t.dataset.date;
    if (mealHistoryOpenDates.has(d)) mealHistoryOpenDates.delete(d); else mealHistoryOpenDates.add(d);
    renderMealHistory();
  }
  else if (action === "add-meal-master") {
    const nameInp = document.getElementById("master-meal-name-input");
    const name = nameInp.value.trim();
    if (!name) return;
    const cal = document.getElementById("master-meal-cal-input").value;
    mealMaster.push({
      id: uid(), name,
      calories: cal ? Number(cal) : null,
      protein: Number(document.getElementById("master-meal-protein-input").value) || 0,
      fat: Number(document.getElementById("master-meal-fat-input").value) || 0,
      carb: Number(document.getElementById("master-meal-carb-input").value) || 0,
    });
    nameInp.value = "";
    document.getElementById("master-meal-cal-input").value = "";
    document.getElementById("master-meal-protein-input").value = "";
    document.getElementById("master-meal-fat-input").value = "";
    document.getElementById("master-meal-carb-input").value = "";
    document.getElementById("master-meal-name-suggestions").innerHTML = "";
    saveState(); renderMasterMealList();
  }
  else if (action === "del-meal-master") {
    mealMaster = mealMaster.filter(m => m.id !== t.dataset.id);
    saveState(); renderMasterMealList();
  }
  else if (action === "ai-lookup-activity") { aiLookupActivityMet(t.dataset.target); }
  else if (action === "select-master-cardio-intensity") {
    const level = ACTIVITY_INTENSITY_LEVELS.find(l => l.key === t.dataset.val);
    if (level) { masterCardioIntensityKey = level.key; masterCardioMet = level.met; renderMasterCardioSection(); }
  }
  else if (action === "select-master-housework-intensity") {
    const level = ACTIVITY_INTENSITY_LEVELS.find(l => l.key === t.dataset.val);
    if (level) { masterHouseworkIntensityKey = level.key; masterHouseworkMet = level.met; renderMasterHouseworkSection(); }
  }
  else if (action === "add-cardio-master") {
    const nameInp = document.getElementById("master-cardio-name-input");
    const name = nameInp.value.trim();
    if (!name) return;
    if (masterCardioEditingId) {
      const x = cardioMaster.find(c => c.id === masterCardioEditingId);
      if (x) { x.name = name; x.met = masterCardioMet; }
      masterCardioEditingId = null;
    } else {
      cardioMaster.push({ id: uid(), name, met: masterCardioMet });
    }
    nameInp.value = "";
    masterCardioIntensityKey = DEFAULT_ACTIVITY_INTENSITY;
    masterCardioMet = ACTIVITY_INTENSITY_LEVELS.find(l => l.key === DEFAULT_ACTIVITY_INTENSITY).met;
    const statusEl = document.getElementById("ai-lookup-cardio-status");
    if (statusEl) statusEl.textContent = "";
    saveState(); renderMasterCardioSection();
  }
  else if (action === "edit-cardio-master") {
    const x = cardioMaster.find(c => c.id === t.dataset.id);
    if (!x) return;
    masterCardioEditingId = x.id;
    masterCardioMet = x.met;
    masterCardioIntensityKey = closestIntensityKey_(x.met);
    const nameInp = document.getElementById("master-cardio-name-input");
    if (nameInp) nameInp.value = x.name;
    renderMasterCardioSection();
  }
  else if (action === "cancel-cardio-master-edit") {
    masterCardioEditingId = null;
    masterCardioIntensityKey = DEFAULT_ACTIVITY_INTENSITY;
    masterCardioMet = ACTIVITY_INTENSITY_LEVELS.find(l => l.key === DEFAULT_ACTIVITY_INTENSITY).met;
    const nameInp = document.getElementById("master-cardio-name-input");
    if (nameInp) nameInp.value = "";
    renderMasterCardioSection();
  }
  else if (action === "del-cardio-master") {
    cardioMaster = cardioMaster.filter(c => c.id !== t.dataset.id);
    if (masterCardioEditingId === t.dataset.id) masterCardioEditingId = null;
    saveState(); renderMasterCardioSection();
  }
  else if (action === "add-housework-master") {
    const nameInp = document.getElementById("master-housework-name-input");
    const name = nameInp.value.trim();
    if (!name) return;
    if (masterHouseworkEditingId) {
      const x = houseworkMaster.find(c => c.id === masterHouseworkEditingId);
      if (x) { x.name = name; x.met = masterHouseworkMet; }
      masterHouseworkEditingId = null;
    } else {
      houseworkMaster.push({ id: uid(), name, met: masterHouseworkMet });
    }
    nameInp.value = "";
    masterHouseworkIntensityKey = DEFAULT_ACTIVITY_INTENSITY;
    masterHouseworkMet = ACTIVITY_INTENSITY_LEVELS.find(l => l.key === DEFAULT_ACTIVITY_INTENSITY).met;
    const statusEl = document.getElementById("ai-lookup-housework-status");
    if (statusEl) statusEl.textContent = "";
    saveState(); renderMasterHouseworkSection();
  }
  else if (action === "edit-housework-master") {
    const x = houseworkMaster.find(c => c.id === t.dataset.id);
    if (!x) return;
    masterHouseworkEditingId = x.id;
    masterHouseworkMet = x.met;
    masterHouseworkIntensityKey = closestIntensityKey_(x.met);
    const nameInp = document.getElementById("master-housework-name-input");
    if (nameInp) nameInp.value = x.name;
    renderMasterHouseworkSection();
  }
  else if (action === "cancel-housework-master-edit") {
    masterHouseworkEditingId = null;
    masterHouseworkIntensityKey = DEFAULT_ACTIVITY_INTENSITY;
    masterHouseworkMet = ACTIVITY_INTENSITY_LEVELS.find(l => l.key === DEFAULT_ACTIVITY_INTENSITY).met;
    const nameInp = document.getElementById("master-housework-name-input");
    if (nameInp) nameInp.value = "";
    renderMasterHouseworkSection();
  }
  else if (action === "del-housework-master") {
    houseworkMaster = houseworkMaster.filter(c => c.id !== t.dataset.id);
    if (masterHouseworkEditingId === t.dataset.id) masterHouseworkEditingId = null;
    saveState(); renderMasterHouseworkSection();
  }
  else if (action === "reset-show") { confirmReset = true; renderTabContent(); }
  else if (action === "reset-no") { confirmReset = false; renderTabContent(); }
  else if (action === "reset-yes-keep-sheet") {
    entries = []; weightEntries = []; mealEntries = []; goals = { weight: 65, weeklyFreq: 3, paceKgPerWeek: DEFAULT_PACE, goalType: DEFAULT_GOAL_TYPE };
    profile = null; moodByDate = {}; confirmReset = false; onboardStep = 0;
    exerciseMaster = []; mealMaster = []; cardioMaster = []; houseworkMaster = []; masterExercisePart = "胸";
    masterCardioEditingId = null; masterHouseworkEditingId = null;
    masterCardioIntensityKey = DEFAULT_ACTIVITY_INTENSITY; masterHouseworkIntensityKey = DEFAULT_ACTIVITY_INTENSITY;
    masterCardioMet = ACTIVITY_INTENSITY_LEVELS.find(l => l.key === DEFAULT_ACTIVITY_INTENSITY).met;
    masterHouseworkMet = ACTIVITY_INTENSITY_LEVELS.find(l => l.key === DEFAULT_ACTIVITY_INTENSITY).met;
    lastStrengthByExercise = {}; lastCardioMinutes = {}; lastHouseworkMinutes = {}; stretchLog = {}; mealDetailOpen = false;
    entryDates = { meal: null, weight: null, training: null };
    nutritionCache = {}; saveNutritionCache();
    activityMetCache = {}; saveActivityMetCache();
    seedExerciseMasterIfEmpty();
    onboardDraft = { age:"", gender:"男性", height:"", weight:"", goalWeight:"", weeklyFreq:"" };
    // 本人の意思で消したので、壊れて読めなかった場合の警告は取り下げる。
    dataLoadFailed = false;
    saveState();
    renderApp();
  }
});
document.getElementById("app").addEventListener("input", (e) => {
  if (e.target.id === "meal-name-input") {
    renderFoodSuggestions("meal-name-suggestions", e.target.value, "meal");
  } else if (e.target.id === "master-meal-name-input") {
    renderFoodSuggestions("master-meal-name-suggestions", e.target.value, "master");
  } else if (e.target.id === "reps-input" || e.target.id === "minutes-input" || e.target.id === "housework-minutes-input") {
    // ユーザーが自分で回数・時間を書き換えたら、以後の自動提案で上書きしない。
    delete e.target.dataset.autofilled;
    // 候補ボタンの選択状態(どれが今の値と一致しているか)も合わせて描き直す。
    if (e.target.id === "minutes-input") {
      const el = document.getElementById("minutes-quick-buttons");
      if (el) el.innerHTML = MINUTE_QUICK_OPTIONS.map(m =>
        `<button type="button" class="chip ${String(m)===String(e.target.value)?"active-b":""}" data-action="select-minutes" data-val="${m}">${m}分</button>`).join("");
    } else if (e.target.id === "housework-minutes-input") {
      const el = document.getElementById("housework-minutes-quick-buttons");
      if (el) el.innerHTML = MINUTE_QUICK_OPTIONS.map(m =>
        `<button type="button" class="chip ${String(m)===String(e.target.value)?"active-c":""}" data-action="select-housework-minutes" data-val="${m}">${m}分</button>`).join("");
    }
  } else if (e.target.id === "steps-input") {
    updateStepsPreview();
  } else if (e.target.id === "distance-input") {
    updateDistancePreview();
  }
});
// 日付欄を変えたら、その日付を覚えておく(1件記録するたびに今日へ戻らないように)。
document.getElementById("app").addEventListener("change", (e) => {
  const kind = e.target.dataset && e.target.dataset.entryDate;
  if (!kind) return;
  entryDates[kind] = e.target.value || null;
  // タブ全体を作り直すと入力途中の内容が消えるので、注意書きだけを差し替える。
  updateEntryDateNotice(kind);
  // 体重フォームの日付欄を変えたときは、体重・体脂肪率の入力欄も日付に合わせて
  // 差し替える(v46.3)。以前はここを何もしていなかったため、フォームを開いた
  // ときの「最新の記録」の値がそのまま残り続け、過去の日付を選んで記録したのに
  // 実際には最新の値(=その日とは無関係な数字)が保存されてしまう事故があった。
  // その日の記録が既にあれば内容を呼び出し、無ければ空欄にして、
  // 誤って無関係な値を保存してしまわないようにする。
  if (kind === "weight") {
    const d = e.target.value || localDateStr();
    const existing = weightEntries.find(w => w.date === d);
    const valEl = document.getElementById("weight-value-input");
    const bfEl = document.getElementById("weight-bodyfat-input");
    const waistEl = document.getElementById("weight-waist-input");
    if (valEl) valEl.value = existing ? existing.weight : "";
    if (bfEl) bfEl.value = existing && existing.bodyFat != null ? existing.bodyFat : "";
    if (waistEl) waistEl.value = existing && existing.waist != null ? existing.waist : "";
  }
});
document.getElementById("app").addEventListener("change", (e) => {
  if (e.target.id === "goal-weight-input") {
    const v = parseFloat(e.target.value);
    if (v > 0) { goals.weight = v; saveState(); renderTabContent(); }
  } else if (e.target.id === "goal-freq-input") {
    const v = parseInt(e.target.value, 10);
    if (v > 0) { goals.weeklyFreq = v; saveState(); renderTabContent(); }
  } else if (e.target.id === "profile-age-input") {
    profile.age = e.target.value; saveState(); renderTabContent();
  } else if (e.target.id === "profile-height-input") {
    profile.height = e.target.value; saveState(); renderTabContent();
  }
});
document.getElementById("app").addEventListener("change", (e) => {
  if (e.target.id === "photo-input" && e.target.files && e.target.files[0]) {
    const f = e.target.files[0];
    e.target.value = "";   // 同じ写真をもう一度選んでも change が起きるようにする
    handlePhotoSelected(f);
    return;
  }
  if (e.target.id === "scale-photo-input" && e.target.files && e.target.files[0]) {
    const f = e.target.files[0];
    e.target.value = "";
    handleScalePhotoSelected(f);
    return;
  }
  if (e.target.id === "import-file-input" && e.target.files && e.target.files[0]) {
    importJsonFile(e.target.files[0]);
    e.target.value = "";
  }
});
document.getElementById("modal-root").addEventListener("click", (e) => {
  if (e.target.id === "modal-overlay") { editing = null; renderEditModal(); return; }
  const suggestionBtn = e.target.closest('[data-action="apply-food-suggestion"]');
  if (suggestionBtn) { applyFoodSuggestion(suggestionBtn.dataset.target, Number(suggestionBtn.dataset.idx)); return; }
  const aiLookupBtn = e.target.closest('[data-action="ai-lookup-nutrition"]');
  if (aiLookupBtn) { aiLookupNutrition(aiLookupBtn.dataset.target); return; }
  const saveMasterBtn = e.target.closest('[data-action="save-food-to-master"]');
  if (saveMasterBtn) { saveFoodToMaster(saveMasterBtn.dataset.target); return; }
  const t = e.target.closest("[data-edit-action]");
  if (!t) return;
  const action = t.dataset.editAction;
  if (action === "dismiss") { editing = null; renderEditModal(); }
  else if (action === "set-part") { editing.tempPart = t.dataset.val; renderEditModal(); }
  else if (action === "set-exercise") { editing.draftExercise = t.dataset.val; renderEditModal(); }
  else if (action === "set-mealtype") { editing.tempMealType = t.dataset.val; renderEditModal(); }
  else if (action === "save") { handleEditSave(); }
  else if (action === "delete") { handleEditDelete(); }
});

// ============ INIT ============
selectedCalDate = localDateStr();
// iOSのSafariは、ページ内のどこかにtouchstartのリスナーが登録されていないと
// ボタンなどの:active(押している間のスタイル)がタップで発火しない癖がある
// (マウスのクリックでは発火するため、PC・自動テストでは気づきにくい)。
// ボタンを押したときの「押した感」(CSS側のbutton:active)を実際のiPhoneでも
// 効かせるため、何もしない空のリスナーを登録しておく(v44.6)。
document.addEventListener("touchstart", function () {}, { passive: true });
loadState();
// 記録を読み込んだあとで、有酸素の初期選択を「いちばん使っている種目」に合わせる
// (loadStateより前に決めると、まだ記録が無い状態で判定してしまうためこの位置)。
selectedCardio = defaultCardio();
loadNutritionCache();
loadActivityMetCache();
// 電波が届かない場所(地下のジム・機内モード)でもアプリを起動できるようにする(v44)。
// sw.js は index.html と同じ場所に置いてください。
// ファイルをそのまま開いた場合(file://)やHTTPS以外では登録できないので、その時は何もしない。
// 記録・同期のしくみには一切影響しません(登録に失敗しても今までどおり動きます)。
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
if (!profile) {
  // Returning user upgrading from a version without the AI profile: prefill the
  // onboarding draft from whatever they already recorded, so they aren't asked
  // to re-enter their existing goal weight / weekly frequency from scratch.
  const latestWeight = [...weightEntries].sort((a,b) => a.date < b.date ? 1 : -1)[0];
  if (latestWeight) onboardDraft.weight = String(latestWeight.weight);
  if (goals.weight) onboardDraft.goalWeight = String(goals.weight);
  if (goals.weeklyFreq) onboardDraft.weeklyFreq = String(goals.weeklyFreq);
}
renderApp();
</script>
</body>
