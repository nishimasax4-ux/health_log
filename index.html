<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>ヘルスログ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
  :root {
    /* POPテーマ(v1)。あたたかみのあるクリーム背景 + ビタミンカラーの配色。
       変数名は元の設計(--teal/--coral/--sand/--slate)を踏襲しつつ、値だけを
       明るくポップな色に差し替えている。
         --teal  … 「良い/成功」の色 → エメラルドグリーン
         --coral … 「注意/警告/削除」の色 → ビビッドなコーラルピンク
         --sand  … 3番目の差し色 → マンゴーイエロー
         --slate … 主役の色・選択中の色 → バイオレット */
    --paper:#FFF6E9; --card:#FFFFFF; --ink:#3A2E1F; --ink-faint:#8A7A63;
    --line:#F0DFC0; --teal:#12A66B; --teal-soft:#12A66B1F; --coral:#FF5D73; --coral-soft:#FF5D731F;
    --sand:#FFA726; --sand-soft:#FFA7261F; --slate:#7C5CFC; --slate-soft:#7C5CFC1F;
    --burn-line:#FF5D73;
    --danger:#E0435C; --danger-ink:#9C2038;
    --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "M PLUS Rounded 1c", "SF Mono", "Courier New", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--font-body);
  }
  #app { max-width: 480px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top, 0px)) 18px 100px; min-height: 100vh; }
  h1 { font-size: 21px; font-weight: 800; margin: 0; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .muted { font-size: 12px; color: var(--ink-faint); }
  .between { display: flex; align-items: center; justify-content: space-between; }
  .row { display: flex; align-items: center; gap: 8px; }
  .wrap { display: flex; flex-wrap: wrap; gap: 6px; }
  .field-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .field-row > * { min-width: 0; overflow: hidden; }
  .field-row > .f-val { flex: 1 1 110px; }
  .field-date { margin-bottom: 10px; }
  .field-date > input { width: 100%; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 16px 17px; margin-bottom: 14px; box-shadow: 0 3px 0 var(--line); }
  .section-title { font-size: 13px; font-weight: 800; letter-spacing: 0.01em; color: var(--ink); margin: 0 0 10px; }
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 11px 13px; box-shadow: 0 3px 0 var(--line); }
  .kpi .kpi-l { font-size: 10.5px; color: var(--ink-faint); margin-bottom: 5px; font-weight: 700; }
  .kpi .kpi-v { font-family: var(--font-mono); font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .kpi .kpi-v span { font-size: 10.5px; font-weight: 400; color: var(--ink-faint); }
  .kpi .kpi-d { font-family: var(--font-mono); font-size: 10.5px; margin-top: 4px; font-weight: 700; }
  .kpi .kpi-d.good { color: var(--teal); } .kpi .kpi-d.bad { color: var(--coral); } .kpi .kpi-d.neutral { color: var(--ink-faint); }
  .status-pill { font-family: var(--font-mono); font-size: 10.5px; border-radius: 999px; padding: 3px 9px; font-weight: 700; white-space: nowrap; }
  .status-pill.bad { background: var(--coral-soft); color: var(--coral); }
  .status-pill.good { background: var(--teal-soft); color: var(--teal); }
  .label { font-size: 11.5px; font-weight: 700; color: var(--ink-faint); display: block; margin-bottom: 4px; }
  input, select, textarea {
    background: #FFFDF8; border: 2px solid var(--line); color: var(--ink);
    border-radius: 12px; padding: 10px 12px; font-size: 14.5px; width: 100%; font-family: inherit;
    max-width: 100%; min-width: 0;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--slate); }
  /* iOSのSafariは type="date" の内部レイアウトにCSSのwidth:100%を無視して
     広めの固有サイズを取ることがあり、カードの右端からはみ出す原因になる。
     ネイティブの見た目(chrome)を外すと、通常のinputと同じくwidth:100%に
     従うようになる(タップしたときのカレンダー選択UIそのものは変わらない)。 */
  input[type="date"] { -webkit-appearance: none; appearance: none; }
  button { cursor: pointer; font-family: inherit; border: none; transition: transform 0.1s ease, opacity 0.1s ease, filter 0.1s ease; }
  button:active, .cal-cell:active { transform: scale(0.94); opacity: 0.8; }
  .btn-primary:active, .chip:active, .sub-tab-btn:active, .btn-icon:active, .icon-btn:active { filter: brightness(0.92); }
  .cal-cell { transition: transform 0.1s ease, opacity 0.1s ease; }
  .chip { padding: 8px 15px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--paper); color: var(--ink); border: 2px solid var(--line); }
  .chip.active { background: var(--slate); color: #fff; border-color: var(--slate); }
  .chip.active-a { background: var(--coral); color: #fff; border-color: var(--coral); }
  .chip.active-b { background: var(--slate); color: #fff; border-color: var(--slate); }
  .btn-primary { width: 100%; padding: 14px; border-radius: 999px; background: var(--slate); color: #fff; font-weight: 800; font-size: 15px; box-shadow: 0 3px 0 #5B3FD9; }
  .btn-icon { border-radius: 12px; padding: 10px 14px; color: #fff; font-weight: 800; font-size: 14px; }
  .icon-btn { background: none; font-size: 18px; padding: 4px 8px; color: var(--ink); }
  .badge { border-radius: 999px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 17px; }
  .entry-row { display: flex; align-items: center; gap: 8px; border: 2px solid var(--line); border-radius: 14px; padding: 9px 11px; margin-top: 7px; font-size: 13.5px; background: #FFFDF8; }
  .del-btn { background: none; color: var(--ink-faint); font-size: 13px; padding: 3px; flex-shrink: 0; }
  .streak-dot { width: 14px; height: 14px; border-radius: 999px; border: 1.5px solid var(--line); }
  .streak-dot.filled { background: var(--coral); border-color: var(--coral); }
  .meter-track { height: 10px; border-radius: 999px; background: var(--paper); overflow: hidden; position: relative; border: 2px solid var(--line); }
  .meter-fill { height: 100%; float: left; }
  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; background: #FFFDF8EE; backdrop-filter: blur(8px);
    border-top: 2px solid var(--line); display: flex; max-width: 480px; margin: 0 auto; z-index: 20;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .tab-item { flex: 1; padding: 10px 4px 8px; text-align: center; background: none; font-size: 10.5px; color: var(--ink-faint); font-weight: 700; }
  .tab-item .ic { display: block; font-size: 19px; margin-bottom: 2px; }
  .tab-item.active { color: var(--slate); }
  .hidden { display: none !important; }
  .banner { background: var(--slate-soft); border: 2px solid #7C5CFC33; border-radius: 14px; padding: 10px 12px; font-size: 11px; color: var(--slate); line-height: 1.5; margin-bottom: 16px; }
  .onboard-step { display: none; }
  .onboard-step.active { display: block; }
  .progress-dots { display: flex; gap: 5px; justify-content: center; margin: 14px 0 4px; }
  .progress-dots span { width: 6px; height: 6px; border-radius: 999px; background: var(--line); }
  .progress-dots span.active { background: var(--slate); }
  .sub-tab-btn { flex: 1; padding: 10px; border-radius: 14px; border: 2px solid var(--line); background: #fff; color: var(--ink); font-weight: 700; font-size: 13px; }
  .sub-tab-btn.active-a { background: var(--coral); color: #fff; border-color: var(--coral); }
  .sub-tab-btn.active-b { background: var(--slate); color: #fff; border-color: var(--slate); }
  .sub-tab-btn.active-c { background: var(--sand); color: #fff; border-color: var(--sand); }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-cell { aspect-ratio: 1; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; border: 1px solid transparent; cursor: pointer; background: var(--paper); }
  .cal-cell.today { border-color: var(--ink); font-weight: 700; }
  .cal-cell.selected { background: var(--line); }
  .cal-dots { display: flex; gap: 2px; margin-top: 2px; min-height: 5px; }
  .cal-dot { width: 5px; height: 5px; border-radius: 999px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(58,46,31,0.5); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal-card { background: #FFFDF8; width: 100%; max-width: 480px; border-radius: 22px 22px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root" class="hidden"></div>

<script>
// ============================================================================
// 目次(このファイルは単一HTMLファイルのまま運用する方針のため分割しません。
// 代わりに、GitHubアプリの「このファイル内を検索」で下の見出し文字列
// (例: "============ STATE") をそのまま検索すると、該当セクションへ
// すぐジャンプできます。セクションはだいたい上から実行順・画面遷移順に
// 並んでいます)
//
//  CONFIG                   … AI中継サーバー(Cloudflare Workers)の接続設定
//  STATE                    … アプリ全体のグローバル状態(entries/profile等)。
//                              各変数の意味は定義箇所のコメント参照
//  HELPERS                  … 日付処理・ID採番などの小さな共通関数
//  FOOD CALORIE LOOKUP      … オフライン食品カロリー辞書(ネット接続不要)
//  AIによる栄養価の概算       … Gemini/Groqへ食品名を投げてカロリー等を推定
//  BACKUP / RESTORE         … JSON書き出し/読み込み
//  CHART HELPERS            … SVGグラフ(体重推移・進捗など)の描画
//  ONBOARDING               … 初回起動時の入力フォーム
//  MAIN APP SHELL           … タブバーを含む全体レイアウトの描画
//  TODAY TAB                … 「今日」タブ(サマリー・目標に対する進捗)
//  MEALS TAB                … 「食事」タブ(記録・よく食べるものクイック入力)
//  WEIGHT TAB                … 「からだ」タブ(体重・体脂肪率・腹囲の記録・推移グラフ)
//  TRAINING TAB              … 「運動」タブ(筋トレ・有酸素・家事の記録・進捗・履歴)
//  SETTINGS TAB              … 「設定」タブ(プロフィール・マスタ管理・データ)
//  EDIT MODAL                … 記録の編集用モーダル
//  ACTIONS                   … 記録の追加・削除などの状態変更ロジック本体
//  毎日の入力を楽にするための…  … 直近入力の再提案などのショートカット機能
//  EVENTS                    … クリック等のイベント委譲(#app全体で1箇所に集約)
//  INIT                      … 起動時の初期化(state読込→描画)
// ============================================================================

// ============ CONFIG ============
// このアプリ(index.html)自体は外部と通信しません。唯一の例外が「🔍 AIで栄養を
// 調べる」「📷 写真から記録」の2つで、これだけは下のWORKER_URL/WORKER_TOKENで
// 指定したAI中継サーバー(Cloudflare Workers)に写真・食品名を送って概算を取得します。
//
// 【配布前にここを設定してください】
//   1. worker.js をCloudflare Workersにデプロイする(README参照)
//   2. デプロイ後に発行されたURL(https://xxxx.workers.dev)をWORKER_URLに貼る
//   3. Worker側の環境変数APP_TOKENと同じ文字列をWORKER_TOKENに貼る
//   4. GEMINI_API_KEYまたはGROQ_API_KEYをWorker側の環境変数に設定する
// これを空のまま配布すると、記録・グラフなどの基本機能はそのまま使えますが、
// AIの2機能だけが「現在ご利用いただけません」と表示されて動きません。
// 利用者(このアプリを使う人)が設定する項目は一切ありません。
const WORKER_URL = "https://health-log-ai.nishimasax4.workers.dev";
const WORKER_TOKEN = "hS4%IpejF6842XppRBJz";
function workerConfigured() { return !!WORKER_URL; }
// アプリのバージョン番号。更新のたびに増やし、設定タブ下部に表示します。
const APP_VERSION = "v1.11";

const STORAGE_KEY = "health-log-data";
const PARTS = ["胸","背中","脚","肩","腕","腹筋"];
const EXERCISES_BY_PART = {
  "胸": ["ベンチプレス","インクラインプレス","ダンベルフライ","プッシュアップ"],
  "背中": ["懸垂","ラットプルダウン","デッドリフト","ベントオーバーロウ"],
  "脚": ["スクワット","レッグプレス","ランジ","レッグカール"],
  "肩": ["ショルダープレス","サイドレイズ","アップライトロウ"],
  "腕": ["アームカール","トライセップエクステンション","ハンマーカール"],
  "腹筋": ["クランチ","プランク","レッグレイズ"],
};
// v48でスポーツ系の種目を追加(テニス・サッカー・バスケットボール・水泳・卓球・
// ゴルフ・登山/ハイキング・ダンス・縄跳び)。それでも足りない場合は、設定タブの
// 「有酸素・スポーツ マスタ」から自分で追加できる(cardioMaster)。
const CARDIO_OPTIONS = ["ランニング","ジョギング","バイク","ウォーキング","クロストレーナー","リカベントバイク","テニス","サッカー","バスケットボール","水泳","卓球","ゴルフ(徒歩)","登山・ハイキング","ダンス","縄跳び","その他"];
// 運動による消費カロリーの概算用(METs法の簡易版)。すべて目安の値です。
// MET値の目安(Compendium of Physical Activities等を参考にした概算・ふつうの強度)。
// ジョギングはランニングよりゆっくりめのペースを想定し、7.0(Compendiumの
// "running, jogging, general"目安)。ランニングと同じ8.0で計算すると消費カロリーを
// 1〜2割ほど多く見積もることになるため、v44.7で項目を分けた。
// クロストレーナー(エリプティカル)は中強度の有酸素運動として5.0。
// リカベントバイクは背もたれ付きで負荷が軽めになりやすいため、通常のバイク(7.0)より低めの4.5。
// スポーツ系はCompendiumの「一般的な強度」目安(テニス=シングルス、サッカー・バスケは
// 試合形式、水泳はゆったりめ、卓球はラリー中心、ゴルフはカートを使わず徒歩想定)。
const CARDIO_MET = { "ランニング":8, "ジョギング":7, "バイク":7, "ウォーキング":3.5, "クロストレーナー":5, "リカベントバイク":4.5,
  "テニス":7, "サッカー":7, "バスケットボール":6.5, "水泳":6, "卓球":4, "ゴルフ(徒歩)":4.8, "登山・ハイキング":6, "ダンス":5, "縄跳び":10, "その他":5 };
// 家事の消費カロリーもMETs法の簡易概算で出す(有酸素運動と同じ計算式)。
// MET値は運動と同様、Compendium of Physical Activities等を参考にした目安。
// v48で「料理」「アイロンがけ」「ゴミ出し・片付け」「窓拭き」を追加。
const HOUSEWORK_OPTIONS = ["掃除機がけ","拭き掃除","洗濯物の干し・取り込み","皿洗い","布団の上げ下ろし","子どもの世話・遊び相手","買い物(徒歩)","庭仕事・草むしり","洗車","料理","アイロンがけ","ゴミ出し・片付け","窓拭き","その他"];
const HOUSEWORK_MET = { "掃除機がけ":3.3, "拭き掃除":3.8, "洗濯物の干し・取り込み":2.3, "皿洗い":2.3, "布団の上げ下ろし":2.5, "子どもの世話・遊び相手":3.0, "買い物(徒歩)":3.5, "庭仕事・草むしり":4.0, "洗車":3.0,
  "料理":2.5, "アイロンがけ":2.3, "ゴミ出し・片付け":2.3, "窓拭き":3.0, "その他":3.0 };
// 上の内蔵リストに無い種目は、設定タブの「有酸素・スポーツ マスタ」「家事マスタ」から
// 自分で追加できる({id, name, met})。運動強度(MET)は「らくらく/ふつう/きつい」の
// 簡易選択、または「🔍 AIで運動強度を調べる」で概算値を入れられる(v48)。
let cardioMaster = [];
let houseworkMaster = [];
// 運動強度の簡易選択肢(METの目安値)。MET自体は利用者にはなじみが薄い単位なので、
// 「らくらく/ふつう/きつい」の3段階から選ぶだけで登録できるようにしている。
const ACTIVITY_INTENSITY_LEVELS = [
  { key: "light",    label: "らくらく", met: 2.5 },
  { key: "moderate", label: "ふつう",   met: 4.5 },
  { key: "vigorous", label: "きつい",   met: 7.0 },
];
const DEFAULT_ACTIVITY_INTENSITY = "moderate";
// 名前からMETを引く(マスタ登録があればそちらを優先、無ければ内蔵表、それも無ければ「その他」)。
function cardioMetFor_(name) {
  const custom = cardioMaster.find(c => c.name === name);
  if (custom && custom.met) return custom.met;
  return CARDIO_MET[name] || CARDIO_MET["その他"];
}
// ---- 歩数からウォーキングを記録する機能(v1.9) ----
// 「歩幅(cm) ≈ 身長(cm) × 0.45」という、歩数計アプリでよく使われる目安で距離を概算する
// (厳密な歩幅は歩き方や年齢で個人差があるが、プロフィールの身長だけから概算する簡易機能
// として割り切っている)。
const STRIDE_RATIO = 0.45;
// 距離→時間の変換に使う歩行ペース。内蔵のウォーキングMET(3.5)が前提とする速度
// (Compendium of Physical Activitiesの「3.0mph(≈4.8km/h)」)に揃えることで、歩数から
// 計算した時間を使っても、時間を直接入力したときと同じ式(MET×3.5×体重/200×分)で
// 矛盾なく消費カロリーが出せるようにしている。
const STEPS_WALK_SPEED_KMH = 4.8;
function strideMetersFromHeight_(heightCm) {
  const h = Number(heightCm) || 165; // プロフィール未登録時などの保険
  return (h * STRIDE_RATIO) / 100;
}
// 歩数と身長から、距離(km)・換算時間(分)・歩幅(m)を概算する。
function walkStatsFromSteps_(steps, heightCm) {
  const strideM = strideMetersFromHeight_(heightCm);
  const s = Math.max(0, Number(steps) || 0);
  const distanceKm = (s * strideM) / 1000;
  const minutes = (distanceKm / STEPS_WALK_SPEED_KMH) * 60;
  return { distanceKm, minutes, strideM };
}
// ---- ランニング・ウォーキングの距離一覧表示(v1.10) ----
// 「歩数で入力」した記録は実測に近いdistanceKmを持っているが、⏱時間で入力した記録には
// 距離が無い。そこで、内蔵のMET値が前提とするペースから、時間(分)を距離に逆算して
// 履歴に「約○km」として表示する(実測ではなく概算であることが伝わるよう「約」を付ける)。
// ランニングは走る人によってペースの差が大きいため、あくまで目安。

const ASSUMED_CARDIO_SPEED_KMH = { "ランニング": 8.0, "ウォーキング": STEPS_WALK_SPEED_KMH };

// 小数を含む値(AIで調べた栄養価など)を足し合わせると、浮動小数点誤差で
// 32.300000000000004 のような桁数の多い数値になり、表示が崩れることがある(v31)。
// 小数点以下1桁に丸めてから使う(表示側は.toFixed(1)で常に1桁そろえる)。
function round1_(n) { return Math.round(n * 10) / 10; }
function localDateStr(d = new Date()) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function weekBuckets(n) {
  const now = new Date();
  const dow = now.getDay();
  const diffToMonday = (dow === 0 ? 6 : dow - 1);
  const thisMonday = new Date(now); thisMonday.setDate(now.getDate() - diffToMonday); thisMonday.setHours(0,0,0,0);
  const trainedDates = new Set(entries.map(e => e.date));
  const buckets = [];
  for (let w = n - 1; w >= 0; w--) {
    const start = new Date(thisMonday); start.setDate(thisMonday.getDate() - w*7);
    let count = 0;
    for (let i = 0; i < 7; i++) { const d = new Date(start); d.setDate(start.getDate()+i); if (trainedDates.has(localDateStr(d))) count++; }
    buckets.push({ start, label: `${start.getMonth()+1}/${start.getDate()}`, count });
  }
  return buckets;
}
// 今週(月曜始まり)がまだ何日残っているか。0 = 日曜(週が終わっている)。
// 「週間トレーニング ○/○回」は今週まだ来ていない曜日を数えられないぶん自然と
// 分母より小さくなるので、週の途中であることを見せて「未達成」と誤解されないようにする。
function daysLeftInWeek() {
  const dow = new Date().getDay();
  const diffToMonday = (dow === 0 ? 6 : dow - 1);
  return 6 - diffToMonday;
}
function uid() { return `${Date.now()}-${Math.random().toString(36).slice(2,8)}`; }
function exerciseNamesForPart(part) { return exerciseMaster.filter(x => x.part === part).map(x => x.name); }
// 種目チップの並び順(画面表示用)。登録順のままだと、実際にはやらない種目が上に残って
// 毎回スクロールが必要になるので、「よく使う種目ほど上」に並べ替える。
// 並び順: ①記録した回数が多い順 → ②同数なら直近に記録した日が新しい順 →
//         ③一度も記録していない種目は、そのあとに登録順のまま並べる。
// (「今日のおすすめ」のローテーション pickExerciseForPart() は、日中に順番が変わって
//  提案が入れ替わらないよう、意図的に登録順のまま exerciseNamesForPart() を使っている。)
function exerciseNamesForPartByUsage(part) {
  const stats = {};
  entries.forEach(e => {
    if (e.type !== "strength" || !e.exercise) return;
    const s = stats[e.exercise] || (stats[e.exercise] = { count: 0, last: "" });
    s.count++;
    if (e.date > s.last) s.last = e.date;
  });
  return exerciseNamesForPart(part)
    .map((name, idx) => ({ name, idx, count: (stats[name] || {}).count || 0, last: (stats[name] || {}).last || "" }))
    .sort((a, b) =>
      (b.count - a.count) ||
      (a.last < b.last ? 1 : a.last > b.last ? -1 : 0) ||
      (a.idx - b.idx))
    .map(x => x.name);
}
// 有酸素運動チップの並び順(v36)。考え方は種目チップ(exerciseNamesForPartByUsage)と同じで、
// 「よく使う種目ほど上」に並べ替える。ただし「その他」は自由入力を呼び出すための特殊な
// ボタンであり実際の運動メニューではないため、使用回数に関係なく常に末尾に固定する。
function cardioOptionsByUsage() {
  const stats = {};
  entries.forEach(e => {
    if (e.type !== "cardio" || !e.exercise) return;
    const s = stats[e.exercise] || (stats[e.exercise] = { count: 0, last: "" });
    s.count++;
    if (e.date > s.last) s.last = e.date;
  });
  // 内蔵の選択肢(「その他」を除く)に、マスタ登録した自分の種目(重複名は除く)を加える。
  const builtIn = CARDIO_OPTIONS.filter(c => c !== "その他");
  const customNames = cardioMaster.map(c => c.name).filter(n => n && !builtIn.includes(n));
  const fixed = [...builtIn, ...customNames];
  const sorted = fixed
    .map((name, idx) => ({ name, idx, count: (stats[name] || {}).count || 0, last: (stats[name] || {}).last || "" }))
    .sort((a, b) =>
      (b.count - a.count) ||
      (a.last < b.last ? 1 : a.last > b.last ? -1 : 0) ||

    .map(x => x.name);

// ============ FOOD CALORIE LOOKUP (offline, built-in dictionary — no external API) ============
function normalizeFoodText(s) { return String(s ?? "").toLowerCase().replace(/[\s　]/g, ""); }
function foodMatchScore_(nameNorm, aliasNorms, q) {
  if (nameNorm === q || aliasNorms.includes(q)) return 100;
  if (nameNorm.startsWith(q) || aliasNorms.some(a => a.startsWith(q))) return 80;
  if (nameNorm.includes(q) || aliasNorms.some(a => a.includes(q))) return 60;
  if (q.includes(nameNorm) && nameNorm.length >= 2) return 50;
  if (aliasNorms.some(a => q.includes(a) && a.length >= 2)) return 45;
  return 0;
}
// 入力しながらの食品候補検索。内蔵の食品辞書(FOOD_CALORIE_DB)だけでなく、
// 自分で登録した「よく食べるもの」(mealMaster、設定タブのマスタ管理)も検索対象に含める。
// 以前はmealMasterが検索対象に入っておらず、マスタ登録済みの食品を検索しても
// 出てこない不具合があった(タップ入力の一覧からは選べても、文字入力での検索では
// 見つからなかった)。
// 「タップ入力の一覧からは非表示」(quickHidden、v29)の項目も検索では見つかるようにする —
// quickHiddenはチップの一覧を減らすための表示上の設定であり、検索自体を止めるものではない。
// 同じ名前がmealMasterと内蔵辞書の両方にある場合は、自分の登録値(実際に使っている値)を
// 優先し、内蔵辞書側は表示しない。
function estimateFoodMatches(query) {
  const q = normalizeFoodText(query);
  if (!q) return [];
  const masterScored = mealMaster.map(m => {
    const score = foodMatchScore_(normalizeFoodText(m.name), [], q);
    return { f: { name: m.name, kcal: m.calories, protein: m.protein, fat: m.fat, carb: m.carb, fromMaster: true }, score };
  }).filter(x => x.score > 0);
  const masterNames = new Set(mealMaster.map(m => normalizeFoodText(m.name)));
  const dictScored = FOOD_CALORIE_DB
    .filter(f => !masterNames.has(normalizeFoodText(f.name)))
    .map(f => {
      const aliasNorms = (f.aliases || []).map(normalizeFoodText);
      const score = foodMatchScore_(normalizeFoodText(f.name), aliasNorms, q);
      return { f, score };
    }).filter(x => x.score > 0);
  const scored = masterScored.map(x => ({ f: x.f, score: x.score + 1000 })) // 自分の登録を優先
    .concat(dictScored)
    .sort((a,b) => b.score - a.score);
  return scored.slice(0, 5).map(x => x.f);
}

// ============ AIによる栄養価の概算(オプション・要ネット接続) ============
// 内蔵の食品辞書(estimateFoodMatches)に候補がない食品向け。AI中継サーバー
// (Cloudflare Workers)経由でGroq/Gemini APIに食品名を送り、カロリー・P・F・Cの
// 概算を取得する。以下の条件がすべて揃っているときだけ動く:
//  1) ソースコードにWORKER_URL・WORKER_TOKENが埋め込み済み(配布前に開発者が設定)
//  2) そのWorkerの環境変数にGEMINI_API_KEYまたはGROQ_API_KEYの少なくとも一方が
//     設定済み(README参照)。両方設定していれば、Geminiがダメだったときに
//     クレジットカード不要の無料APIであるGroqへ自動的に回る。
// 未設定の場合はエラーメッセージを表示するだけで、他の機能には一切影響しない。
//
// AI中継サーバー(Worker)から返ったエラーメッセージに、原因ごとの対処法を添える。
function friendlyAiError_(rawMessage) {
  const msg = String(rawMessage || "不明なエラー");
  if (/HTTP 503|UNAVAILABLE|high demand|overloaded/i.test(msg)) {
    return "サーバーが一時的に混雑しています。しばらく待ってからもう一度お試しください。";
  }
  if (/HTTP 429|RESOURCE_EXHAUSTED|quota/i.test(msg)) {
    return "AIの無料枠の上限に達したようです。時間をおいてから再度お試しください。";
  }
  if (/HTTP 401|unauthorized|invalid token/i.test(msg)) {
    return "AI中継サーバーの認証に失敗しました(開発者にご連絡ください)。";
  }
  return msg;
}

// AIは指示しても ```json …``` で囲んで返してくることがあるので、囲みを外してから読む。
// AIの返事からJSONを取り出す(v44.1で強化)。
// 「JSONだけ返して」と指示しても、実際には次のような返り方をすることがあります。
//   ・```json … ``` で囲んでくる
//   ・「はい、判定しました:」のような前置きや、後ろに感想を付けてくる
//   ・出力の上限に達して、途中でぶつ切りになる ← 写真の判定でいちばん多い
// v44までは、これらのどれか1つでも起きると丸ごと失敗していました。
// ここでは、囲みを外す → そのまま読む → 読めなければ「最後まで揃っているところ」
// までで組み立て直す、の順で粘ります。
function parseAiJson_(text) {
  if (!text) return null;
  let s = String(text).trim();
  // ``` で囲まれていれば、その中身だけを見る(閉じの ``` が無くても中身は取れる)。
  const fenced = s.match(/```(?:json|JSON)?\s*([\s\S]*?)(?:```|$)/);
  if (fenced && fenced[1].trim()) s = fenced[1].trim();
  // 最初の { か [ より前は前置きの文章なので捨てる。
  const start = s.search(/[{[]/);
  if (start === -1) return null;
  s = s.slice(start);
  try { return JSON.parse(s); } catch (e) { /* 続けて修復を試みる */ }
  return repairJson_(s);
}
// 途中で切れている / 後ろに文章が付いている応答を、
// 「完成している要素だけ」で組み立て直す。
function repairJson_(s) {
  // 閉じ括弧の位置を後ろから順に試す。1つの料理が丸ごと入っている位置で切れば、
  // その料理までは正しく読み取れる(3件目が途中で切れていても2件は使える)。
  const cuts = [];
  let inStr = false, esc = false;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (inStr) {
      if (esc) esc = false;
      else if (c === "\\") esc = true;
      else if (c === '"') inStr = false;
      continue;
    }
    if (c === '"') inStr = true;
    else if (c === "}" || c === "]") cuts.push(i + 1);
  }
  // 応答が長いときに総当たりしないよう、後ろ200箇所までに限る。
  for (let k = cuts.length - 1; k >= 0 && k >= cuts.length - 200; k--) {
    const closed = closeOpenBrackets_(s.slice(0, cuts[k]));
    if (closed) { try { return JSON.parse(closed); } catch (e) {} }
  }
  return null;
}
// 開いたままの { [ を閉じて、JSONとして読める形にする。
// 括弧の対応が取れていない(壊れている)場合は null。
function closeOpenBrackets_(s) {
  const stack = [];
  let inStr = false, esc = false;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (inStr) {
      if (esc) esc = false;
      else if (c === "\\") esc = true;
      else if (c === '"') inStr = false;
      continue;
    }
    if (c === '"') inStr = true;
    else if (c === "{") stack.push("}");
    else if (c === "[") stack.push("]");
    else if (c === "}" || c === "]") { if (stack.pop() !== c) return null; }
  }
  if (inStr) return null;
  let out = s.replace(/,\s*$/, "");   // 末尾のカンマは残せない
  for (let i = stack.length - 1; i >= 0; i--) out += stack[i];
  return out;
}

// あるため、呼び出し側では上のparseAiJson_系の修復ロジックで吸収する。

  const calEl = document.getElementById(ids.cal);

  // exercise master from the built-in suggestions so there is something to
  // edit right away. Meals start empty since we can't guess what someone eats.
  seedExerciseMasterIfEmpty();
}
function seedExerciseMasterIfEmpty() {
  if (exerciseMaster.length === 0) {
    Object.keys(EXERCISES_BY_PART).forEach(part => {
      EXERCISES_BY_PART[part].forEach(name => exerciseMaster.push({ id: uid(), part, name }));
    });
  }
}
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ entries, weightEntries, mealEntries, goals, profile, moodByDate, exerciseMaster, mealMaster, cardioMaster, houseworkMaster, lastStrengthByExercise, lastCardioMinutes, lastHouseworkMinutes, stretchLog }));
    // 直前まで保存できていなかった場合は、復旧したことを警告表示にも反映する。
    if (storageWriteFailed) { storageWriteFailed = false; renderDataWarning(); }
  } catch (e) {
    // 保存できなかったことを黙って握りつぶすと、画面には記録が出ているのに
    // 次にアプリを開いたときには消えている、という最悪の形で気づくことになる(v44.9)。
    // 容量超過やプライベートブラウズが原因のことが多いので、その場で知らせる。
    console.error("save error", e);

    renderDataWarning();
  }
}

// iOS Safari(特にホーム画面に追加したPWA)では、アプリがバックグラウンドから
// 復帰した直後などにfetch()が一時的に「Load failed」という汎用的なネットワーク
// エラーで失敗することがある(WebKitの既知の挙動)。一度だけ短い間隔を空けて
// 自動的に再試行することで、こうした一時的な失敗を吸収する。
function sleep_(ms) { return new Promise(r => setTimeout(r, ms)); }
// "Load failed"(Safari)や"Failed to fetch"(Chrome)など、fetch自体が届かなかった
// ことを示す汎用的なネットワークエラーには、原因の見当がつくよう補足説明を添える。
function friendlyNetError_(rawMessage) {
  const msg = String(rawMessage || "");
  if (/load failed|failed to fetch|networkerror|network error/i.test(msg)) {
    return `${msg}(ネットワーク接続の問題か、AI中継サーバーが一時的に応答していない可能性があります。時間をおいて再試行してください)`;
  }
  return msg;
}
async function fetchWithRetry_(url, options, retries = 1, delayMs = 400) {
  try {
    return await fetch(url, options);
  } catch (err) {
    // タイムアウトによる中断は、再試行しても待ち時間が倍になるだけなので即座に諦める。
    if (err && err.name === "AbortError") throw err;
    if (retries <= 0) throw err;
    await sleep_(delayMs);
    return fetchWithRetry_(url, options, retries - 1, delayMs);
  }
}

// AI呼び出しの応答待ちタイムアウト(外部APIを挟むぶん長めに取る)。
const AI_TIMEOUT_MS = 45000;

// AI中継サーバー(Cloudflare Workers)への共通POST。トークンを必ず添えて、
// レスポンスのJSON化まで面倒を見る。
async function aiPost(payload, timeoutMs) {
  const ms = timeoutMs || AI_TIMEOUT_MS;
  const controller = typeof AbortController !== "undefined" ? new AbortController() : null;
  const timer = controller ? setTimeout(() => controller.abort(), ms) : null;
  let res;
  try {
    res = await fetchWithRetry_(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ token: WORKER_TOKEN }, payload)),
      signal: controller ? controller.signal : undefined,
    });
  } catch (err) {
    if (err && err.name === "AbortError") {
      throw new Error(`${Math.round(ms / 1000)}秒待っても応答がありませんでした。混雑している可能性があるので、時間をおいて再試行してください。`);
    }
    throw err;
  } finally {
    if (timer) clearTimeout(timer);
  }
  let data;
  try {
    data = await res.json();
  } catch (parseErr) {
    throw new Error(`AI中継サーバーから予期しない応答がありました(HTTP ${res.status})。`);
  }
  return data;
}

// ============ 写真から食事を記録(v43) ============
// カメラで撮った写真をAIに渡して料理名と栄養値の候補を受け取り、
// マスタ・内蔵辞書に同じものがあればそちらの値を優先して候補に出す。
// 写真は端末側で縮小してから送る(通信量とAIの無料枠の節約、応答時間の短縮)。
const PHOTO_MAX_SIDE = 768;      // 長辺をこの画素数まで縮小する
const PHOTO_JPEG_QUALITY = 0.7;  // 料理の判別には十分な画質
let photoStatus = "idle";        // idle | analyzing | done | error
let photoError = null;
let photoResults = null;         // [{name, kcal, protein, fat, carb, note, source}]
let photoMode = null;            // "alternatives"(3つから選ぶ) | "items"(1つずつ記録) | null

// 画像を縮小してJPEGのbase64(data:のプレフィックスなし)にする。
// iPhoneの写真はそのままだと数MBあり、AIへ送るには大きすぎる。
// canvasを通すことでHEICなどもJPEGに揃えられる(送信先が対応していない形式を避けられる)。
// maxSide を省略すると PHOTO_MAX_SIDE(768px)。体重計の表示を読むときは、
// 小さな液晶の数字がつぶれないよう、呼び出し側から大きめの値を渡す(v1.5)。
function downscaleImage_(file, maxSide) {
  const limit = maxSide || PHOTO_MAX_SIDE;
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      try {
        const scale = Math.min(1, limit / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL("image/jpeg", PHOTO_JPEG_QUALITY);
        resolve(dataUrl.slice(dataUrl.indexOf(",") + 1));
      } catch (e) { reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("写真を読み込めませんでした")); };
    img.src = url;
  });
}

// 読み取れたJSONから料理の一覧を取り出す(v44.1)。
// AIは指示どおり {"foods":[…]} で返すこともあれば、配列だけ返したり、
// キー名を日本語や別名にしてくることもあるので、そこは受け止める。
// 「料理が写っていない」という正しい答え(空の一覧)と、
// 「読み取れなかった」(null)は区別する。前者はエラーではない。
function photoFoodsFrom_(parsed) {
  if (!parsed) return null;
  const list = Array.isArray(parsed) ? parsed
             : Array.isArray(parsed.foods) ? parsed.foods
             : Array.isArray(parsed.items) ? parsed.items
             : Array.isArray(parsed.料理) ? parsed.料理
             : null;
  if (!list) return null;
  const pick = (o, keys) => { for (const k of keys) if (o[k] != null && o[k] !== "") return o[k]; return null; };
  return list.map(f => {
    if (!f || typeof f !== "object") return null;
    const name = pick(f, ["name", "料理名", "食品名", "dish", "food", "title"]);
    if (!name) return null;
    return {
      name: String(name).slice(0, 60),
      kcal: Math.round(Number(pick(f, ["kcal", "calories", "カロリー", "energy"])) || 0),
      protein: round1_(pick(f, ["protein", "たんぱく質", "タンパク質", "P"])),
      fat: round1_(pick(f, ["fat", "脂質", "F"])),
      carb: round1_(pick(f, ["carb", "carbs", "carbohydrate", "炭水化物", "C"])),
      note: (() => { const n = pick(f, ["note", "reason", "備考", "見分け方"]); return n ? String(n).slice(0, 40) : ""; })(),
    };
  }).filter(Boolean);
}
// 候補の並びが「どれか1つを選ぶもの」なのか「1つずつ記録できるもの」なのかを返す(v44.2)。
// これが分からないと、定食の写真で1件だけ記録して終わってしまう。
// 古い応答(modeが無い)のときは、どちらとも言い切らない中立の表示にする。
function photoModeFrom_(parsed) {
  const m = parsed && !Array.isArray(parsed) ? parsed.mode : null;
  return m === "alternatives" || m === "items" ? m : null;
}

// AIが答えた料理名が、マスタや内蔵辞書にあるものと「同じ」と言い切れる場合だけ、
// そちらの値に差し替える。曖昧な一致で勝手に置き換えると、分量の違う別物の
// 数値が入ってしまうため、正規化した名前が完全に一致する場合に限る。
function resolveFoodSource_(aiFood) {
  const target = normalizeFoodText(aiFood.name);
  if (target) {
    const master = mealMaster.find(m => normalizeFoodText(m.name) === target && m.calories != null);
    if (master) {
      return { name: master.name, kcal: master.calories, protein: master.protein || 0,
               fat: master.fat || 0, carb: master.carb || 0, note: aiFood.note || "", source: "master" };
    }
    const dict = FOOD_CALORIE_DB.find(f => normalizeFoodText(f.name) === target
      || (f.aliases || []).some(a => normalizeFoodText(a) === target));
    if (dict) {
      return { name: dict.name, kcal: dict.kcal, protein: dict.protein || 0,
               fat: dict.fat || 0, carb: dict.carb || 0, note: aiFood.note || "", source: "dict" };
    }
  }
  return { ...aiFood, source: "ai" };
}

async function handlePhotoSelected(file) {
  if (!file) return;
  if (!workerConfigured()) {
    photoStatus = "error";
    photoError = "⚠️ AI機能は現在ご利用いただけません。カロリーは手入力してください。";
    renderTabContent(); return;
  }
  photoStatus = "analyzing"; photoError = null; photoResults = null; photoMode = null; renderTabContent();
  try {
    const imageBase64 = await downscaleImage_(file);
    // 写真の判定は文章が長くなりやすく、上限700では途中で切れることがあったので広げる(v44.1)。
    const data = await aiVision_(AI_PROMPTS.photo(), imageBase64, "image/jpeg", { json: true, maxTokens: 1500 });
    if (!data || data.status !== "ok" || !data.text) {
      photoStatus = "error";
      photoError = friendlyAiError_(data && data.message);
    } else {
      const parsed = parseAiJson_(data.text);
      const foods = photoFoodsFrom_(parsed);
      if (!foods) {
        photoStatus = "error";
        // 何が返ってきたのかを必ず見せる。これが分からないと原因を絞り込めない。
        photoError = "AIの応答を読み取れませんでした。もう一度撮り直すか、手で入力してください。\n\n【AIからの返事】\n"
                   + String(data.text).slice(0, 300);
      } else {
        photoResults = foods.slice(0, 3).map(resolveFoodSource_);
        photoMode = photoModeFrom_(parsed);
        photoStatus = "done";
      }
    }
  } catch (e) {
    photoStatus = "error";
    photoError = friendlyNetError_(e && e.message ? e.message : String(e));
  }
  renderTabContent();
}

// 食事タブに出すカード。撮影ボタンと、判定結果の候補を並べる。
// ============ 体重計の写真から読み取る(v1.5) ============
// 体重の手入力は毎日発生するいちばん面倒な作業なので、体重計の表示を撮るだけで
// 入力欄が埋まるようにする。メーカー連携やヘルスケア連携と違って設定が不要で、
// スマート機能のない体重計でも使える(食事の写真判定と同じ仕組みを流用)。
//
// 【安全策】読み取った値は入力欄に入れるだけで、記録はしない。
// 利用者が数字を目視で確認して「＋ 記録する」を押して初めて保存される
// (AIの読み取りは間違うことがあるため。食事の写真判定と同じ考え方)。
const SCALE_PHOTO_MAX_SIDE = 1280; // 液晶の数字がつぶれないよう、食事写真より高解像度で送る
const WEIGHT_MIN = 20, WEIGHT_MAX = 300; // 体重として受け付ける範囲(kg)
let scalePhotoBusy = false;
function setScaleStatus_(text, isError) {
  const el = document.getElementById("scale-photo-status");
  if (!el) return;
  el.textContent = text || "";
  el.style.color = isError ? "var(--coral)" : "";
}
function setScaleButtonBusy_(busy) {
  const btn = document.getElementById("scale-photo-btn");
  if (!btn) return;
  btn.disabled = busy;
  btn.textContent = busy ? "読み取り中…" : "📷 体重計の表示を撮る";
}
async function handleScalePhotoSelected(file) {
  if (!file || scalePhotoBusy) return;
  if (!workerConfigured()) {
    setScaleStatus_("⚠️ AI機能は現在ご利用いただけません。数値は手で入力してください。", true);
    return;
  }
  scalePhotoBusy = true;
  setScaleButtonBusy_(true);
  setScaleStatus_("🔄 AIが数値を読み取っています…(ネット接続が必要です)");
  try {
    const imageBase64 = await downscaleImage_(file, SCALE_PHOTO_MAX_SIDE);
    const data = await aiVision_(AI_PROMPTS.scale(), imageBase64, "image/jpeg", { json: true, maxTokens: 300 });
    if (!data || data.status !== "ok" || !data.text) {
      setScaleStatus_("⚠️ 読み取れませんでした: " + friendlyAiError_(data && data.message), true);
      return;
    }
    const parsed = parseAiJson_(data.text);
    if (!parsed) {
      setScaleStatus_("⚠️ AIの応答を読み取れませんでした。もう一度撮るか、手で入力してください。", true);
      return;
    }
    // 明らかにありえない値は、読み取りミスとして採用しない(体重と体脂肪率を
    // 取り違える・小数点を落とすといった間違いが起きうるため)。
    const w = Number(parsed.weight);
    const bf = Number(parsed.bodyFat);
    const okW = Number.isFinite(w) && w >= WEIGHT_MIN && w <= WEIGHT_MAX;
    const okBf = Number.isFinite(bf) && bf >= BODYFAT_MIN && bf <= BODYFAT_MAX;
    if (!okW && !okBf) {
      setScaleStatus_("⚠️ 数字を読み取れませんでした。表示部分が画面いっぱいに入るように、明るい場所で撮り直してみてください。", true);
      return;
    }
    const filled = [];
    if (okW) {
      const el = document.getElementById("weight-value-input");
      if (el) { el.value = Math.round(w * 10) / 10; filled.push(`体重 ${Math.round(w * 10) / 10}kg`); }
    }
    if (okBf) {
      const el = document.getElementById("weight-bodyfat-input");
      if (el) { el.value = Math.round(bf * 10) / 10; filled.push(`体脂肪率 ${Math.round(bf * 10) / 10}%`); }
    }
    // 読み取れなかった項目は明示する。黙っていると、入力欄が空のまま
    // 「＋ 記録する」を押してしまい、なぜ記録されないのか分からなくなるため。
    const missing = [];
    if (!okW) missing.push("体重");
    if (!okBf) missing.push("体脂肪率");
    setScaleStatus_(`✅ ${filled.join(" / ")} を読み取りました。数字が合っているか確認して「＋ 記録する」を押してください`
      + (missing.length ? `(${missing.join("・")}は読み取れなかったので、必要なら手で入力してください)` : ""));
  } catch (e) {
    setScaleStatus_("⚠️ 通信エラーが発生しました: " + friendlyNetError_(e && e.message ? e.message : String(e)), true);
  } finally {
    scalePhotoBusy = false;
    setScaleButtonBusy_(false);
  }
}

const WAIST_MIN = 40, WAIST_MAX = 200;

// 家庭用の体組成計(BIA方式)は体内の水分量に強く影響され、時間帯・食事・入浴の前後で
// 数%動くため、単発の値を使うと目標カロリーが日ごとに数十kcal揺れて使いにくくなる。

function recentBodyFat_() {
  const cutoff = localDateStr(new Date(Date.now() - BODYFAT_AVG_DAYS * 86400000));
  const vals = weightEntries
    .filter(w => w.bodyFat != null && w.bodyFat >= BODYFAT_MIN && w.bodyFat <= BODYFAT_MAX && w.date >= cutoff)
    .sort((a, b) => a.date < b.date ? 1 : -1)
    .slice(0, BODYFAT_AVG_COUNT)
    .map(w => w.bodyFat);

/**

 *
 * v40では次のようにする。
 *   1. 体重を増減させたいペース(kg/週)から、必要な赤字/黒字を計算する
 *      (体脂肪1kg≒7200kcal)
 *   2. 目安カロリー = 基礎消費 ∓ 必要な赤字/黒字

  const goal = (goalType === "maintain" || goalType === "muscle") ? weight : rawGoal;

  else if (goalType === "muscle") direction = "muscle";

  // 「足りない分」が生じるのは下限で頭打ちになったときだけ。下限に当たっていない場合の
  // 数kcalのズレは10kcal単位に丸めた残りでしかないので、0として扱う(画面に

  const actualDeficit = Math.round(tdee - targetCalories);
  let gapByExercise = floored ? Math.max(0, needDeficit - actualDeficit) : 0;
  // 30kcal未満の差は、下限ぎりぎりで10kcal単位に丸めた結果でしかない。
  // 「運動で補う分 5kcal」のような、行動に結びつかない数字は出さない。
  if (gapByExercise < 30) gapByExercise = 0;

  // --- PFC ---
  // たんぱく質。体脂肪率が分かっていれば除脂肪体重×係数、分からなければ従来どおり
  // 目標体重×係数。脂肪組織はたんぱく質をほとんど必要としないので、体組成が分かる
  // なら除脂肪体重を基準にするほうが理にかなっている(体脂肪率が平均的な人では
  // どちらもほぼ同じ値になる)。筋力アップは通常より少し多めの係数を使う(v47)。
  const proteinFactorLean = direction === "muscle" ? 2.2 : 2.0;
  const proteinFactorWeight = direction === "muscle" ? 1.8 : 1.6;
  let targetProtein = leanMass != null ? Math.round(leanMass * proteinFactorLean) : Math.round(goal * proteinFactorWeight);
  // 脂質は目安カロリーの25%を基本に、ホルモン等のため目標体重×0.8gを下限とする。
  // ただし上限は30%(食事摂取基準の目標量の上限)に収める——総カロリーが低いと
  // 下限側だけを見て30%を超えてしまうため。上限が0.6g/kgを割る場合はそちらを優先する。
  const fatMin = Math.round(goal * 0.8);
  const fatMax = Math.max(Math.round(targetCalories * 0.30 / 9), Math.round(goal * 0.6));
  let targetFat = Math.min(Math.max(Math.round(targetCalories * 0.25 / 9), fatMin), fatMax);
  // たんぱく質と脂質だけで目安カロリーを超えてしまう極端な場合は、
  // 炭水化物が0にならないよう脂質→たんぱく質の順に削って辻褄を合わせる。

      Math.floor((targetCalories - carbFloorKcal - targetProtein * 4) / 9));

    }

    bmr: Math.round(bmr), tdee: Math.round(tdee), targetCalories,
    targetProtein, targetFat, targetCarb,

    pace, direction, goalType, needDeficit, actualDeficit, gapByExercise, floored,
    floor: Math.round(floor), goalWeight: goal,

    bmrMethod, bodyFat, bmrAgeOutOfRange,

    fatMass: leanMass != null ? Math.round((weight - leanMass) * 10) / 10 : null,

}

// 目安カロリーに占める各栄養素の割合(%エネルギー)。厚労省の目標量と見比べるために表示する。
function macroPercents(t) {
  if (!t || !t.targetCalories) return null;
  const pc = v => Math.round(v / t.targetCalories * 1000) / 10;
  return { protein: pc(t.targetProtein * 4), fat: pc(t.targetFat * 9), carb: pc(t.targetCarb * 4) };
}
function getTargets() {
  if (!profile) return null;
  const latestWeight = [...weightEntries].sort((a,b) => a.date < b.date ? 1 : -1)[0];
  if (!latestWeight) return null;
  return computeTargets(profile, latestWeight.weight, goals.weight);
}
// 「AIのひとこと」カードの既定コメント(外部AIに未接続、または問い合わせる前に
// 表示するルールベースの一言)。以前は「今日の調子」ボタンの自己申告に応じて
// 文面を変えていたが、その場の主観よりも実際の記録(運動・体重・食事)を見た
// ほうが的確なので、直近の記録から組み立てる形に変更した(v44.8)。
function generateDailyAdvice() {
  const today = localDateStr();
  const parts = [];

  // 今週の運動状況。まだなら軽く促す/来ていればいつも通りで大丈夫と伝える。
  const thisWeek = weekBuckets(1)[0];
  if (thisWeek && thisWeek.count === 0) parts.push("今週はまだ運動の記録がありません。軽い運動からで大丈夫なので、体を動かしてみましょう。");
  else parts.push("いつも通りのペースで大丈夫です。");

  // 直近1週間でよくやっている種目に具体的に触れる(記録をちゃんと見ていると伝わるように)。
  const since7 = localDateStr(new Date(Date.now() - 6 * 86400000));
  const exCount = {};
  entries.filter(e => e.date >= since7).forEach(e => {
    const name = e.type === "strength" ? (e.exercise || e.part) : e.exercise;
    if (name) exCount[name] = (exCount[name] || 0) + 1;
  });
  const topExercise = Object.keys(exCount).sort((a, b) => exCount[b] - exCount[a])[0];
  if (topExercise) parts.push(`直近1週間は${topExercise}によく取り組んでいますね。`);

  // 体重の傾向(直近1週間で意味のある変化があれば触れる)。
  const sortedW = [...weightEntries].sort((a, b) => a.date < b.date ? -1 : 1);
  if (sortedW.length >= 2) {
    const latest = sortedW[sortedW.length - 1];
    const weekAgo = [...sortedW].reverse().find(w => w.date <= since7) || sortedW[0];
    const diff = round1_(latest.weight - weekAgo.weight);
    if (weekAgo.date !== latest.date && Math.abs(diff) >= 0.2) {
      parts.push(`体重は直近1週間で${diff > 0 ? "+" : ""}${diff}kgの変化です。`);
    }
  }

  const targets = getEffectiveCalorieTarget(today);
  if (targets) {
    const todayCal = mealEntries.filter(m => m.date === today).reduce((s, m) => s + (m.calories || 0), 0);
    const remaining = targets.effectiveTarget - todayCal;
    if (todayCal > 0) {
      if (remaining < -100) parts.push(`カロリーは目標より${Math.abs(Math.round(remaining))}kcalほど多めですが、気にしすぎなくて大丈夫。明日以降で自然に調整できます。`);
      else if (remaining > targets.effectiveTarget * 0.5) parts.push("まだ食事の記録が少なめです。しっかり栄養を摂りましょう。");
    }
    if (targets.exerciseBurn > 0) {
      parts.push(targets.exerciseBonus > 0
        ? `今日の運動で約${targets.exerciseBurn}kcal消費しているので、${targets.exerciseBonus}kcalぶん目標カロリーを上乗せしています。`
        : `今日の運動で約${targets.exerciseBurn}kcal消費しています。食事だけでは足りない赤字の穴埋めに充てているので、目標カロリーは据え置きです。`);
    }
  }

  // 目標の種類に応じたひとこと(v47)。
  const goalTypeForAdvice = currentGoalType();
  if (goalTypeForAdvice === "muscle") parts.push("筋力アップ狙いなので、たんぱく質と休養もしっかり確保しましょう。");
  else if (goalTypeForAdvice === "maintain") parts.push("今の体重をキープする設定です。大きく増減していなければ順調です。");

  return parts.join(" ");
}

// ---- カロリー収支(摂取 vs TDEE+運動消費)の推移・アドバイス ----
// すべてルールベースの概算です。外部AI・外部APIには接続していません。
// その日の運動による概算消費カロリーを、筋トレ・有酸素に分けて返す。
// 筋トレは1セットあたりの目安、有酸素はMETsと体重・時間からの簡易推定。
function estimateExerciseBurnBreakdownForDate(dateStr, weightKg) {
  let strength = 0, cardio = 0;
  entries.filter(e => e.date === dateStr).forEach(e => {
    if (e.type === "strength") {
      strength += STRENGTH_KCAL_PER_SET;
    } else if (e.type === "housework") {
      const met = houseworkMetFor_(e.exercise);
      cardio += (met * 3.5 * weightKg / 200) * (e.minutes || 0);
    } else {
      const met = cardioMetFor_(e.exercise);
      cardio += (met * 3.5 * weightKg / 200) * (e.minutes || 0);
    }
  });
  strength = Math.round(strength);
  cardio = Math.round(cardio);
  return { strength, cardio, total: strength + cardio };
}
function estimateExerciseBurnForDate(dateStr, weightKg) {
  return estimateExerciseBurnBreakdownForDate(dateStr, weightKg).total;
}
// 運動タブの「進捗」用: 直近n日分の、筋トレ・有酸素それぞれの概算消費カロリー。
// カロリー収支グラフと同じ推定式を使うので、両者で数字が食い違うことはない。
function computeBurnHistory(days) {
  const latestWeight = [...weightEntries].sort((a,b) => a.date < b.date ? 1 : -1)[0];
  const weightKg = latestWeight ? latestWeight.weight : 60; // 体重未記録でも目安は出せるようにする
  const history = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const dateStr = localDateStr(d);
    history.push({ date: dateStr, ...estimateExerciseBurnBreakdownForDate(dateStr, weightKg) });
  }
  return history;
}
// その日の「摂取カロリー目標(TDEE±体重目標での増減) + その日の運動で消費した分」を返す。
// トレーニングした日ほど、表示上の目標カロリーがその分だけ上乗せされる(=たくさん動いた日は
// その分多く食べてよい、という考え方)。今日の状況・食事タブの表示に使う。
function getEffectiveCalorieTarget(dateStr) {
  const targets = getTargets();
  if (!targets) return null;
  const latestWeight = [...weightEntries].sort((a,b) => a.date < b.date ? 1 : -1)[0];

  const list = distanceEntries_();
  const buckets = [];
  for (let w = n - 1; w >= 0; w--) {
    const start = new Date(thisMonday); start.setDate(thisMonday.getDate() - w * 7);
    const end = new Date(start); end.setDate(start.getDate() + 7);
    let running = 0, walking = 0;
    list.forEach(e => {
      const d = new Date(e.date + "T00:00:00");
      if (d >= start && d < end) {
        if (e.exercise === "ランニング") running += e.km; else walking += e.km;
      }
    });
    buckets.push({ start, label: `${start.getMonth() + 1}/${start.getDate()}`, running: round1_(running), walking: round1_(walking), total: round1_(running + walking) });

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:140px;">
    ${ticks}${bars}${line}${labels}
  </svg>`;
}
function balanceBarSvg(history) {
  const w=300, h=110, padL=32, padR=8, padT=10, labelH=12;
  const withData = history.filter(x => x.hasData);
  if (withData.length === 0) {
    // 「食事を記録すると」ではなく、何が足りないのかを正しく伝える。食事名だけ記録して
    // カロリーを入れていない場合、記録はあるのに収支は計算できないため。
    const anyMeals = history.some(x => mealEntries.some(m => m.date === x.date));
    return anyMeals
      ? '<p class="muted" style="font-size:12px;">食事は記録されていますが、カロリーが入力されていないため収支を計算できません。食事にカロリーを入力すると(「🔍 AIで栄養を調べる」または手入力)、ここに推移が表示されます。</p>'
      : '<p class="muted" style="font-size:12px;">食事を記録すると、カロリー収支の推移が表示されます。</p>';
  }
  // 縦の目盛りは「記録がある日」だけで決める。全日を対象にすると、食事を記録して
  // いない日(摂取0kcal=TDEE分まるごとの赤字)が最大値になってしまい、実際に記録した
  // 日の棒が数ピクセルまで潰れて、食事を追加しても変化して見えなくなっていた。
  //
  // さらに、ゼロ線を常に中央に置くと、減量中でずっと赤字の人は上半分がまるごと
  // 空白になり、棒が下半分の中で潰れてしまう。実際のデータの範囲に合わせて
  // ゼロ線の位置と上下の目盛りを決め、グラフの高さを無駄なく使う。
  const rawMax = Math.max(...withData.map(x => x.balance), 0);
  const rawMin = Math.min(...withData.map(x => x.balance), 0);
  const roundUp = v => Math.max(Math.ceil(v / 100) * 100, 0);
  let posMax = roundUp(rawMax);
  let negMax = roundUp(-rawMin);
  if (posMax === 0 && negMax === 0) { posMax = 100; negMax = 100; }
  const span = posMax + negMax;
  const plotH = h - padT - labelH;
  const zeroY = padT + (posMax / span) * plotH;
  const slot = (w - padL - padR) / history.length;
  const bw = Math.min(14, slot - 4);
  const scale = plotH / span;
  const bars = history.map((x,i) => {
    const bx = padL + i*slot + slot/2 - bw/2;
    if (!x.hasData) return `<rect x="${bx}" y="${zeroY-1}" width="${bw}" height="2" rx="1" fill="var(--line)"/>`;
    const barH = Math.max(Math.abs(x.balance) * scale, 1.5);
    const y = x.balance >= 0 ? zeroY - barH : zeroY;
    const color = x.balance >= 0 ? "var(--coral)" : "var(--teal)";
    return `<rect x="${bx}" y="${y}" width="${bw}" height="${barH}" rx="2" fill="${color}"/>`;
  }).join("");
  const labelIdxs = [0, Math.floor((history.length-1)/2), history.length-1];
  const labels = labelIdxs.map(i => {
    const d = new Date(history[i].date + "T00:00:00");
    return `<text x="${padL + i*slot + slot/2}" y="${h-1}" font-size="7" fill="var(--ink-faint)" text-anchor="middle">${d.getMonth()+1}/${d.getDate()}</text>`;
  }).join("");
  // 目盛りを数値で添える。棒の高さは自動的に伸縮するため、これがないと
  // 「棒が伸びた=何kcal変わったのか」が読み取れず、変化しているのか分かりにくい。
  const tickVals = [posMax, 0, -negMax].filter((v,i,a) => a.indexOf(v) === i);
  const ticks = tickVals.map(v => {
    const y = zeroY - v * scale;
    const line = v === 0 ? "" : `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--line)" stroke-width="0.5"/>`;
    return `${line}<text x="${padL-3}" y="${y+2.5}" font-size="7" fill="var(--ink-faint)" text-anchor="end">${v > 0 ? "+" : ""}${v}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:120px;">
    ${ticks}
    <line x1="${padL}" y1="${zeroY}" x2="${w-padR}" y2="${zeroY}" stroke="var(--ink-faint)" stroke-width="1"/>
    ${bars}${labels}
  </svg>`;
}
function meterHtml(value, target, colorHex) {
  const pct = target > 0 ? Math.min(100, Math.round((value/target)*100)) : 0;
  const overPct = target > 0 && value > target ? Math.min(30, Math.round(((value-target)/target)*100)) : 0;
  return `<div class="meter-track">
    <div class="meter-fill" style="width:${Math.max(0,Math.min(pct,100))}%;background:${colorHex};"></div>
    ${overPct > 0 ? `<div class="meter-fill" style="width:${overPct}%;background:var(--coral);"></div>` : ""}
  </div>`;
}

function initialPlanPreview() {
  const w = Number(onboardDraft.weight) || 0, gw = Number(onboardDraft.goalWeight) || 0;
  if (!w || !gw) return "体重・目標体重を入力すると、目安が表示されます。";
  const dir = w > gw ? "減量" : w < gw ? "増量" : "維持";
  return `現在 ${w}kg → 目標 ${gw}kg(${dir})。無理のないペースで記録を続けましょう。`;
}
function handleOnboardClick(e) {
  const t = e.target.closest("[data-ob-action]");
  if (!t) return;
  const action = t.dataset.obAction;
  if (action === "set-gender") { onboardDraft.gender = t.dataset.val; renderOnboarding(); }
  else if (action === "back") { onboardStep = Math.max(0, onboardStep-1); renderOnboarding(); }
  else if (action === "next") { onboardStep += 1; renderOnboarding(); }
  else if (action === "finish") { finishOnboarding(); }
}
function finishOnboarding() {
  profile = {
    age: Number(onboardDraft.age) || 30,
    gender: onboardDraft.gender,
    height: Number(onboardDraft.height) || 165,
    lifestyle: DEFAULT_LIFESTYLE, // 設定タブで変更できる(運動ぶんは記録から自動加算)
  };
  const w = Number(onboardDraft.weight);
  const gw = Number(onboardDraft.goalWeight);
  if (gw > 0) goals.weight = gw;
  goals.weeklyFreq = Number(onboardDraft.weeklyFreq) || 3;
  if (weightEntries.length === 0 && w > 0) weightEntries.push({ date: localDateStr(), weight: w });
  activeTab = "today";
  saveState();
  renderApp();
}

function autoSelectMealTypeByTime() {
  const h = new Date().getHours();
  if (h >= 4 && h < 10) selectedMealType = "朝食";
  else if (h >= 10 && h < 15) selectedMealType = "昼食";

  // 戻ってきたら勝手に完了扱いになっていた、という驚きを防ぐため)。
  if (activeTab === "stretch" && tab !== "stretch") stopStretchTimer();

// 食事を日付ごとにグループ化して新しい順に表示する。「今日の食事」カードは
// 今日の分だけをまとめて表示するのに対し、こちらは過去に記録した食事も日付付きで
// 探せるようにするための一覧(直近14日分まで)。
// その日の「摂取カロリー」と「消費カロリー(TDEE + その日の運動)」をまとめて返す。
// カロリー収支グラフ(computeCalorieBalanceHistory)とまったく同じ計算式を使うことで、
// 食事タブの日別表示とグラフの数字が食い違わないようにしている。
// プロフィール・体重が未入力で計算できない場合は null。
function dayEnergySummary_(dateStr) {
  const targets = getTargets();
  if (!targets) return null;
  const latestWeight = [...weightEntries].sort((a,b) => a.date < b.date ? 1 : -1)[0];
  if (!latestWeight) return null;
  const dayMeals = mealEntries.filter(m => m.date === dateStr);
  const intake = dayMeals.reduce((s,m) => s + (m.calories||0), 0);
  const burn = estimateExerciseBurnForDate(dateStr, latestWeight.weight);
  const totalBurn = targets.tdee + burn;
  // グラフと同じ判定: カロリーを1つも入力していない日は「不明」扱いにして収支を出さない。
  const hasIntakeData = dayMeals.some(m => (m.calories || 0) > 0);
  return { intake, tdee: targets.tdee, burn, totalBurn, balance: intake - totalBurn, hasIntakeData };
}
// 食事の履歴の各日に添える「摂取 / 消費 / 収支」の1行。
function dayEnergyLineHtml_(dateStr) {
  const s = dayEnergySummary_(dateStr);
  if (!s) return "";
  const burnText = s.burn > 0
    ? `消費 ${s.totalBurn}kcal(基礎消費 ${s.tdee} + 運動 ${s.burn})`
    : `消費 ${s.totalBurn}kcal(基礎消費のみ)`;
  if (!s.hasIntakeData) {
    return `<p class="muted mono" style="font-size:10.5px;margin:0 0 6px;line-height:1.5;">摂取 未入力 ／ ${burnText}</p>`;
  }
  const surplus = s.balance >= 0;
  const color = surplus ? "var(--coral)" : "var(--teal)";
  const label = surplus ? "黒字" : "赤字";
  return `<p class="muted mono" style="font-size:10.5px;margin:0 0 6px;line-height:1.5;">摂取 ${s.intake}kcal ／ ${burnText} → <span style="color:${color};font-weight:700;">${label} ${Math.abs(s.balance)}kcal</span></p>`;
}
// 食事の履歴の各日に添える、その日のP/F/C合計と目標に対する達成度(v34)。
// 「今日の食事」カードのP/F/Cメーターとまったく同じ考え方を、過去の日にも展開したもの。
// 過去の摂取状況が数字の羅列(各食事のP/F/Cメモ)だけでは分かりにくいという声を受けて追加。
// カロリーが1件も入力されていない日は、そもそも合計に意味がないため表示しない
// (dayEnergyLineHtml_の「摂取 未入力」判定と同じ考え方)。
function dayPfcHtml_(dateStr) {
  const targets = getTargets();

  const dayMeals = mealEntries.filter(m => m.date === dateStr);
  const hasIntakeData = dayMeals.some(m => (m.calories || 0) > 0);
  if (!hasIntakeData) return "";
  const protein = round1_(dayMeals.reduce((s,m) => s + (m.protein||0), 0));
  const fat = round1_(dayMeals.reduce((s,m) => s + (m.fat||0), 0));
  const carb = round1_(dayMeals.reduce((s,m) => s + (m.carb||0), 0));
  const col = (label, value, target, colorHex) => `<div style="flex:1;">
    <div class="between" style="margin-bottom:2px;"><span class="muted" style="font-size:9.5px;">${label}</span><span class="mono" style="font-size:9.5px;">${value.toFixed(1)}/${target}g</span></div>
    ${meterHtml(value, target, colorHex)}
  </div>`;
  return `<div class="row" style="margin:0 0 8px;">
    ${col("たんぱく質", protein, targets.targetProtein, "var(--coral)")}
    ${col("脂質", fat, targets.targetFat, "var(--sand)")}
    ${col("炭水化物", carb, targets.targetCarb, "var(--slate)")}
  </div>`;
}

// ============ X(旧Twitter)へのシェア(v37) ============
// 「ダイエットの経過をXにポストしたい」というご相談に対応。XのAPIは2026年2月以降
// 完全従量課金(投稿1件ごとに課金)になり、アプリから自動投稿するには開発者登録と
// 支払い設定が必須になった。課金なしで使える方法として、Xが公式に提供している
// Web Intent(https://x.com/intent/tweet?text=...)を使う。これはAPIキーや
// アプリ登録が一切不要で、リンクを開くとログイン済みのXの投稿画面(iOSでXアプリが
// 入っていればアプリ側)にテキストが入力された状態で遷移する。実際にポストするかどうかは
// 最後まで本人の操作(確認してタップ)に委ねられる。
// 投稿文は「開始体重→現在の体重とその差分・記録日数」を自動生成する。体重の記録が
// 1件しかない(まだ経過と呼べるほどのデータがない)場合は、差分の代わりに現在値と
// 目標値だけを出す。
function buildXShareText() {
  const sortedAsc = [...weightEntries].sort((a,b) => a.date < b.date ? -1 : 1);
  if (sortedAsc.length === 0) return null;
  const start = sortedAsc[0], latest = sortedAsc[sortedAsc.length - 1];
  // v46.14で見出しを「からだの記録」に統一したが、減量中の利用者からは
  // 「#ダイエット記録のままがよかった」との声があったため、v5.1で元の
  // 「ダイエット経過 📉」「#ダイエット記録」に戻しつつ、増量方向のときだけ
  // 対になる「増量記録 📈」「#増量記録」を使うようにする(実際の変化(記録が
  // 2件以上あればその増減、無ければ目標との位置関係)から判定)。どちらとも
  // 言えない(変化なし・目標未設定)場合だけ、中立な「からだの記録 📊」にする。
  const trendDiff = sortedAsc.length >= 2 ? round1_(latest.weight - start.weight)
    : (goals.weight ? latest.weight - goals.weight : 0);
  const title = trendDiff < 0 ? "ダイエット経過 📉" : trendDiff > 0 ? "増量記録 📈" : "からだの記録 📊";
  const hashtag = trendDiff < 0 ? "#ダイエット記録" : trendDiff > 0 ? "#増量記録" : "#からだの記録";
  const lines = [title];
  if (sortedAsc.length >= 2 && start.date !== latest.date) {
    const days = Math.round((new Date(latest.date) - new Date(start.date)) / 86400000) + 1;
    const diff = round1_(latest.weight - start.weight);
    const diffStr = (diff > 0 ? "+" : "") + diff.toFixed(1);
    lines.push(`体重: ${start.weight}kg → ${latest.weight}kg (${diffStr}kg)`);
    lines.push(`記録${days}日目`);
  } else {
    lines.push(`体重: ${latest.weight}kg`);
    if (goals.weight) lines.push(`目標: ${goals.weight}kg`);
  }

  // 体組成(体脂肪量)の内訳(v46)。開始時点(手入力の基準、なければ体脂肪率を
  // 記録した最初の1件)と直近を比べられるときだけ差分つきで、体脂肪率しか
  // まだないときは直近の値だけを添える。
  const bodyComp = computeBodyComposition_();
  if (bodyComp.first && bodyComp.last && bodyComp.first.date !== bodyComp.last.date) {
    const dFat = round1_(bodyComp.last.fat - bodyComp.first.fat);
    const dFatStr = (dFat > 0 ? "+" : "") + dFat.toFixed(1);
    lines.push(`体脂肪量: ${bodyComp.first.fat.toFixed(1)}kg → ${bodyComp.last.fat.toFixed(1)}kg (${dFatStr}kg)`);
  } else if (bodyComp.last) {
    lines.push(`体脂肪率: ${bodyComp.last.bf.toFixed(1)}%`);
  }

  // カロリーの内訳(v38)。その日の摂取・消費とその差に加えて、記録開始からの
  // 累計収支も添える。プロフィール未入力などで消費カロリーを計算できない場合は、
  // この2行だけを省いて従来どおりの文面になる。
  const today = localDateStr();
  const todayIntake = mealEntries
    .filter(m => m.date === today)
    .reduce((s,m) => s + (m.calories||0), 0);
  const targets = getTargets();
  const weightKg = latest ? latest.weight : null;
  if (targets && weightKg && todayIntake > 0) {
    const todayBurn = Math.round(targets.tdee + estimateExerciseBurnForDate(today, weightKg));
    const todayDiff = Math.round(todayIntake - todayBurn);
    lines.push(`今日: 摂取${Math.round(todayIntake).toLocaleString()} / 消費${todayBurn.toLocaleString()}kcal (${todayDiff >= 0 ? "+" : "−"}${Math.abs(todayDiff).toLocaleString()})`);
  }
  const totals = computeCalorieTotals();
  if (totals) {
    lines.push(`累計収支: ${totals.balance >= 0 ? "+" : "−"}${Math.abs(totals.balance).toLocaleString()}kcal (${totals.days}日)`);
  }

  lines.push(hashtag);
  const text = lines.join("\n");
  // Xの1投稿の上限(280文字相当)に収まらなくなった場合に備え、長くなりすぎたら
  // カロリー関連の行、それでも収まらなければ体組成の行も落として、体重の経過
  // だけの従来の文面に戻す(Bluesky側は300文字までとXより余裕があるので、
  // ここで作った文章をそのまま使い回せる)。
  if (text.length > 260) {
    let trimmed = lines.filter(l => !/^今日: |^累計収支: /.test(l)).join("\n");
    if (trimmed.length > 260) {
      trimmed = lines.filter(l => !/^今日: |^累計収支: |^体脂肪/.test(l)).join("\n");
    }
    return trimmed;
  }
  return text;
}
function openXShare() {
  const text = buildXShareText();
  if (!text) return;
  window.open("https://x.com/intent/tweet?text=" + encodeURIComponent(text), "_blank");
}
// Blueskyへのシェア(v46)。Xと同様、公式のWeb Intent
// (https://bsky.app/intent/compose?text=...)を使う。APIキーやアプリ登録は
// 不要で、リンクを開くとログイン済みのBlueskyの投稿画面に文章が入力された

// buildXShareText()が作る文章(260文字以内に収めてある)をそのまま使い回せる。
function openBlueskyShare() {
  const text = buildXShareText();
  if (!text) return;
  window.open("https://bsky.app/intent/compose?text=" + encodeURIComponent(text), "_blank");
}

  const bmiTile = latest ? `

// 部位ごとの実施状況の一覧(v46.12)。「どの部位をしばらくやっていないか」は
// 履歴を遡らないと分からなかったため、部位ごとに最終実施日・経過日数・
// 直近30日のセット数を一覧表にした。しばらくやっていない部位ほど上に来るよう
// 並べ、色でも目立たせることで、次に何をやるべきかが一目で分かるようにする。
function bodyPartStatusHtml() {
  const strengthEntries = entries.filter(e => e.type === "strength");
  if (!strengthEntries.length) return "";
  const nowMs = new Date(localDateStr()).getTime();
  const rows = PARTS.map(part => {
    const partEntries = strengthEntries.filter(e => e.part === part);
    if (!partEntries.length) return { part, last: null, daysAgo: null, sets30: 0 };
    const last = partEntries.reduce((max, e) => e.date > max ? e.date : max, partEntries[0].date);
    const daysAgo = Math.round((nowMs - new Date(last).getTime()) / 86400000);
    const sets30 = partEntries.filter(e => (nowMs - new Date(e.date).getTime()) <= 30 * 86400000).length;
    return { part, last, daysAgo, sets30 };
  }).sort((a, b) => (b.daysAgo ?? Infinity) - (a.daysAgo ?? Infinity));

  const rowHtml = ({ part, last, daysAgo, sets30 }) => {
    const stale = daysAgo === null || daysAgo >= 14;
    const daysLabel = daysAgo === null ? "未実施" : daysAgo === 0 ? "今日" : `${daysAgo}日前`;
    return `<div class="entry-row">
      <div class="badge" style="background:${stale ? "var(--coral-soft)" : "var(--slate-soft)"};">🏋️</div>
      <div style="flex:1;">
        <div style="font-weight:600;">${esc(part)}</div>
        <div class="muted" style="font-size:11px;">${last ? `最終 ${last}・直近30日 ${sets30}セット` : "記録なし"}</div>
      </div>
      <span class="status-pill ${stale ? "bad" : "good"}">${daysLabel}</span>
    </div>`;
  };
  return `<div class="card">
    <p class="section-title">📋 部位ごとの実施状況</p>
    <p class="muted" style="font-size:10.5px;margin:0 0 8px;line-height:1.6;">しばらくやっていない部位が上に来るように並んでいます。14日以上空いている部位は赤で示しています。</p>
    ${rows.map(rowHtml).join("")}
  </div>`;
}
// 運動による概算消費カロリーの推移(筋トレ+有酸素の合計)。
// 以前は「種目別の推移」で、種目を1つ選ばないと何も見えず、しかも筋トレの重量しか
// 対象にしていなかったため、有酸素だけを記録している場合はいつまでも表示されなかった。
// 種目を問わず「その日、運動で何kcal消費したか」の合計を出すようにしている。
function progressBurnHtml() {
  const history = computeBurnHistory(14);
  const total14 = history.reduce((s,x) => s + x.total, 0);
  const strength14 = history.reduce((s,x) => s + x.strength, 0);
  const cardio14 = history.reduce((s,x) => s + x.cardio, 0);
  const activeDays = history.filter(x => x.total > 0).length;
  const week = history.slice(-7);
  const week7 = week.reduce((s,x) => s + x.total, 0);
  const label = '<p class="label" style="margin:14px 0 4px;">運動による消費カロリー(概算・直近14日)</p>';
  if (total14 <= 0) {
    return label + '<p class="muted" style="font-size:12px;">運動を記録すると、消費カロリーの推移が表示されます。</p>';
  }
  const legend = `<p class="muted" style="font-size:10.5px;margin:4px 0 0;">🟧 筋トレ ${strength14}kcal ／ 🟦 有酸素・家事 ${cardio14}kcal(14日合計 ${total14}kcal)</p>`;
  const summary = `<div class="between" style="background:var(--paper);border-radius:10px;padding:8px 12px;margin-top:8px;gap:8px;">
      <div style="text-align:center;flex:1;">
        <div class="muted" style="font-size:10px;">直近7日</div>
        <div class="mono" style="font-size:14px;font-weight:600;">${week7}<span style="font-size:10px;">kcal</span></div>
      </div>
      <div style="text-align:center;flex:1;">
        <div class="muted" style="font-size:10px;">運動した日</div>
        <div class="mono" style="font-size:14px;font-weight:600;">${activeDays}<span style="font-size:10px;">/14日</span></div>
      </div>
      <div style="text-align:center;flex:1;">
        <div class="muted" style="font-size:10px;">運動日の平均</div>
        <div class="mono" style="font-size:14px;font-weight:600;">${activeDays ? Math.round(total14/activeDays) : 0}<span style="font-size:10px;">kcal</span></div>
      </div>
    </div>`;
  return label + burnStackedBarSvg(history) + legend + summary;
}
// 運動1件ぶんの概算消費カロリー(履歴の各行に表示する用、v44.6)。日ごとの合計
// (estimateExerciseBurnBreakdownForDate)と同じ式を使うので、合計とも矛盾しない。
// 体重が未記録のときは、日ごとの集計と同じく60kgを仮の値として使う。
function estimateEntryBurn_(e, weightKg) {
  if (e.type === "strength") return STRENGTH_KCAL_PER_SET;
  if (e.type === "housework") {
    const met = houseworkMetFor_(e.exercise);
    return Math.round((met * 3.5 * (weightKg || 60) / 200) * (e.minutes || 0));
  }
  const met = cardioMetFor_(e.exercise);
  return Math.round((met * 3.5 * (weightKg || 60) / 200) * (e.minutes || 0));
}
function trainingEntryRowHtml(e) {
  const isStrength = e.type === "strength";
  const isHousework = e.type === "housework";
  const latestWeight = [...weightEntries].sort((a,b) => a.date < b.date ? 1 : -1)[0];
  const burn = estimateEntryBurn_(e, latestWeight ? latestWeight.weight : null);
  // 距離の表示: 歩数入力(v1.9)・距離入力(v1.11)の記録は実測に近い距離(distanceKm)を
  // そのまま、それ以外のランニング・ウォーキングの記録は、内蔵MET値の想定ペースから
  // 概算した距離を「約○km」として添える(実測と紛れないよう「約」で明示)。
  let distanceHtml = "";
  if (!isStrength && !isHousework) {
    if (e.steps) {
      distanceHtml = ` <span class="mono muted">(${Number(e.steps).toLocaleString()}歩・${Number(e.distanceKm||0).toFixed(1)}km)</span>`;
    } else if (e.distanceKm != null) {
      distanceHtml = ` <span class="mono muted">(${Number(e.distanceKm).toFixed(1)}km)</span>`;
    } else {
      const speed = ASSUMED_CARDIO_SPEED_KMH[e.exercise];
      if (speed && e.minutes) {
        distanceHtml = ` <span class="mono muted">(約${(speed * e.minutes / 60).toFixed(1)}km)</span>`;
      }
    }
  }
  const detail = isStrength
    ? `<span style="font-weight:600;">[${esc(e.part)}]</span>${e.exercise ? " "+esc(e.exercise) : ""} <span class="mono" style="color:var(--sand);">${e.weight}kg × ${e.reps}</span>`
    : `${esc(e.exercise)} <span class="mono" style="color:var(--sand);">${e.minutes}分</span>${distanceHtml}`;
  return `<div class="entry-row">
    <div class="badge" style="background:${isStrength ? "var(--coral-soft)" : isHousework ? "var(--sand-soft)" : "var(--slate-soft)"};">${isStrength ? "🏋️" : isHousework ? "🧹" : "💨"}</div>

function calendarGridHtml() {
  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = localDateStr();
  const trainedDates = new Set(entries.map(e => e.date));
  const weightDates = new Set(weightEntries.map(w => w.date));
  const mealDates = new Set(mealEntries.map(m => m.date));
  let cells = "";
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell" style="visibility:hidden;"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const dots = [];
    if (trainedDates.has(dateStr)) dots.push('<div class="cal-dot" style="background:var(--coral);"></div>');
    if (weightDates.has(dateStr)) dots.push('<div class="cal-dot" style="background:var(--sand);"></div>');
    if (mealDates.has(dateStr)) dots.push('<div class="cal-dot" style="background:var(--teal);"></div>');
    cells += `<div class="cal-cell ${dateStr===todayStr?"today":""} ${dateStr===selectedCalDate?"selected":""}" data-action="select-day" data-date="${dateStr}">
      <span>${d}</span><div class="cal-dots">${dots.join("")}</div>
    </div>`;
  }
  const weekHead = WEEKDAY.map(w => `<div style="text-align:center;font-size:10px;color:var(--ink-faint);">${w}</div>`).join("");
  return `
    <div class="between" style="margin-bottom:8px;">
      <button data-action="cal-prev" style="background:none;border:none;font-size:16px;padding:4px 10px;">‹</button>
      <span class="mono" style="font-weight:700;">${year}年${month+1}月</span>
      <button data-action="cal-next" style="background:none;border:none;font-size:16px;padding:4px 10px;">›</button>
    </div>
    <div class="cal-grid" style="margin-bottom:4px;">${weekHead}</div>
    <div class="cal-grid">${cells}</div>`;
}
function dayDetailHtml(dateStr) {
  const dd = new Date(dateStr + "T00:00:00");
  const dayEntries = entries.filter(e => e.date === dateStr);
  const dayWeight = weightEntries.find(w => w.date === dateStr);
  const dayMeals = mealEntries.filter(m => m.date === dateStr);
  const header = `<p class="mono" style="font-weight:700;font-size:13px;margin:14px 0 6px;">${dateStr}(${WEEKDAY[dd.getDay()]})</p>`;
  if (dayEntries.length === 0 && !dayWeight && dayMeals.length === 0) {
    return header + '<p class="muted" style="font-size:12px;">この日の記録はありません。</p>';
  }
  const trainingRows = dayEntries.map(trainingEntryRowHtml).join("");
  const weightRow = dayWeight ? `<div class="entry-row">
      <div class="badge" style="background:var(--sand-soft);">⚖️</div>
      <div style="flex:1;">体重 <span class="mono" style="color:var(--sand);">${dayWeight.weight}kg</span></div>
      <button class="del-btn" data-action="edit-weight" data-date="${dayWeight.date}">✏️</button>
      <button class="del-btn" data-action="del-weight" data-date="${dayWeight.date}">🗑️</button>
    </div>` : "";
  const mealRows = dayMeals.map(mealEntryRowHtml).join("");
  return header + trainingRows + weightRow + mealRows;
}
function renderHistory() {
  // 「運動」タブの履歴なので、リスト表示は運動の記録だけを見せる。
  // (以前はここに体重・食事の記録も混ざって表示されており、「運動の履歴なのに
  //  食事が出てくる」と分かりづらい状態だった。体重は「からだ」タブ、食事は
  //  「食事」タブの「📖 食事の履歴」にそれぞれ専用の一覧がある。)
  // 一方カレンダー表示は「その日に何をしたか」を一目で見るためのものなので、
  // 運動・体重・食事の3色の印と、日付をタップしたときの全記録表示はそのまま残す。
  const toggle = `
    <div class="between" style="margin-bottom:8px;">
      <p class="section-title" style="margin:0;">${historyView === "calendar" ? "カレンダー(全記録)" : "運動の履歴"}</p>
      <div class="row" style="gap:4px;width:auto;">
        <button class="chip ${historyView==="list"?"active":""}" data-action="view-list">リスト</button>
        <button class="chip ${historyView==="calendar"?"active":""}" data-action="view-calendar">カレンダー</button>
      </div>
    </div>`;
  let body;
  if (historyView === "calendar") {
    body = `<p class="muted" style="font-size:10.5px;margin:0 0 8px;line-height:1.5;">印: 🔴運動 / 🟡体重 / 🔵食事。日付をタップするとその日の全記録が見られます。</p>${calendarGridHtml()}${dayDetailHtml(selectedCalDate)}`;
  } else {
    const dates = [...new Set(entries.map(e => e.date))].sort((a,b) => a < b ? 1 : -1);
    if (dates.length === 0) {
      body = '<p class="muted">まだ運動の記録がありません。今日のトレーニングを記録してみましょう。</p>';
    } else {
      const latestWeight = [...weightEntries].sort((a,b) => a.date < b.date ? 1 : -1)[0];
      // 履歴が長く伸びて見づらくならないよう、初期状態は直近10日ぶんだけを表示し、
      // 残りは「もっと見る」を押したときだけ表示する(v1.11・要望⑦)。
      const HISTORY_DAYS_COLLAPSED = 10;
      const visibleDates = trainingHistoryExpanded ? dates : dates.slice(0, HISTORY_DAYS_COLLAPSED);
      body = visibleDates.map(d => {
        const dd = new Date(d + "T00:00:00");
        const dayItems = entries.filter(e => e.date === d);
        const dayBurn = dayItems.reduce((s,e) => s + estimateEntryBurn_(e, latestWeight ? latestWeight.weight : null), 0);
        const isOpen = trainingHistoryOpenDates.has(d);
        const items = dayItems.map(trainingEntryRowHtml).join("");
        return `<div style="margin-bottom:14px;">
          <button type="button" class="between" style="width:100%;background:none;border:none;padding:0;text-align:left;" data-action="toggle-history-day" data-date="${d}">
            <span class="row" style="gap:6px;width:auto;align-items:baseline;">
              <span class="mono" style="font-weight:700;font-size:14px;">${d}</span>
              <span class="muted">(${WEEKDAY[dd.getDay()]})</span>
            </span>
            <span class="row" style="gap:8px;width:auto;align-items:center;">
              ${dayBurn ? `<span class="muted mono" style="font-size:11px;">計約${dayBurn}kcal</span>` : ""}
              <span class="muted" id="history-chevron-${d}">${isOpen ? "▾" : "▸"}</span>
            </span>
          </button>
          <div id="history-items-${d}" class="${isOpen ? "" : "hidden"}" style="margin-top:6px;">${items}</div>
        </div>`;
      }).join("");
      if (!trainingHistoryExpanded && dates.length > HISTORY_DAYS_COLLAPSED) {
        body += `<button type="button" class="chip" style="width:100%;text-align:center;margin-top:2px;" data-action="toggle-history-expand">過去の記録をもっと見る(残り${dates.length - HISTORY_DAYS_COLLAPSED}日分)</button>`;
      } else if (trainingHistoryExpanded && dates.length > HISTORY_DAYS_COLLAPSED) {
        body += `<button type="button" class="chip" style="width:100%;text-align:center;margin-top:2px;" data-action="toggle-history-expand">直近${HISTORY_DAYS_COLLAPSED}日分に折りたたむ</button>`;
      }
      body += '<p class="muted" style="font-size:10.5px;margin:4px 0 0;line-height:1.5;">体重は「からだ」タブ、食事は「食事」タブの「📖 食事の履歴」で確認できます。カレンダー表示なら、その日の全記録をまとめて見られます。</p>';
    }
  }
  const el = document.getElementById("history-section");
  if (el) el.innerHTML = `<div class="card">${toggle}${body}</div>`;
}

// Targeted DOM patches for chip selections inside the Training form, so that a
// part/exercise/cardio-type chip click never wipes reps/weight/minutes the user
// already typed (only add-training / sub-tab switches rebuild the whole card).
function bindTrainingFormWidgets() {

  renderTrainingFormOptions();

  renderDistanceHistory();
}
// 歩数モード(v1.9): 歩数→距離→時間に変換し、既存のminutes-inputへ書き込む。
// こうしておくことで、記録処理(handleAddTraining)や前回値の提案などの既存の仕組みを
// そのまま使い回せる(「時間を直接入力したのと同じ扱い」になる)。
function updateStepsPreview() {
  const stepsInput = document.getElementById("steps-input");
  if (!stepsInput) return; // 有酸素タブを開いていない、または時間入力モードのときは何もしない
  const minutesInput = document.getElementById("minutes-input");
  const previewEl = document.getElementById("steps-preview");
  const stepsQuickEl = document.getElementById("steps-quick-buttons");
  const steps = Number(stepsInput.value) || 0;
  if (stepsQuickEl) {
    stepsQuickEl.innerHTML = STEPS_QUICK_OPTIONS.map(s =>
      `<button type="button" class="chip ${String(s)===String(steps)?"active-b":""}" data-action="select-steps" data-val="${s}">${s.toLocaleString()}歩</button>`).join("");
  }
  const heightCm = profile ? profile.height : null;
  const { distanceKm, minutes } = walkStatsFromSteps_(steps, heightCm);
  const roundedMinutes = steps > 0 ? Math.max(1, Math.round(minutes)) : 0;
  if (minutesInput) minutesInput.value = roundedMinutes || "";
  if (!previewEl) return;
  if (steps <= 0) { previewEl.textContent = ""; return; }
  const met = cardioMetFor_("ウォーキング");
  const latestWeight = [...weightEntries].sort((a,b) => a.date < b.date ? 1 : -1)[0];
  const weightKg = latestWeight ? latestWeight.weight : 60;
  const kcal = Math.round((met * 3.5 * weightKg / 200) * roundedMinutes);
  previewEl.innerHTML = `${steps.toLocaleString()}歩 ≈ <span class="mono">${distanceKm.toFixed(1)}km</span> ≈ <span class="mono">${roundedMinutes}分</span>のウォーキング(約<span class="mono">${kcal}</span>kcal)${!profile || !profile.height ? `<br>※身長が未登録のため、仮の値(165cm)で計算しています。設定タブで身長を登録すると精度が上がります。` : ""}`;
}
// 距離モード(v1.11): 距離→時間に変換し、既存のminutes-inputへ書き込む(歩数モードと同じ
// 考え方)。記録される距離そのものは入力値をそのまま使う(実測)。時間はASSUMED_CARDIO_SPEED_KMH
// のランニングのペースからの概算で、あくまで消費カロリー計算用。
function updateDistancePreview() {
  const distInput = document.getElementById("distance-input");
  if (!distInput) return; // 有酸素タブを開いていない、または距離入力モードのときは何もしない
  const minutesInput = document.getElementById("minutes-input");
  const previewEl = document.getElementById("distance-preview");
  const distQuickEl = document.getElementById("distance-quick-buttons");
  const dist = Number(distInput.value) || 0;
  if (distQuickEl) {
    distQuickEl.innerHTML = DISTANCE_QUICK_OPTIONS.map(k =>
      `<button type="button" class="chip ${String(k)===String(dist)?"active-b":""}" data-action="select-distance" data-val="${k}">${k}km</button>`).join("");
  }
  const speed = ASSUMED_CARDIO_SPEED_KMH["ランニング"];
  const minutes = dist > 0 ? (dist / speed) * 60 : 0;
  const roundedMinutes = dist > 0 ? Math.max(1, Math.round(minutes)) : 0;
  if (minutesInput) minutesInput.value = roundedMinutes || "";
  if (!previewEl) return;
  if (dist <= 0) { previewEl.textContent = ""; return; }
  const met = cardioMetFor_("ランニング");
  const latestWeight = [...weightEntries].sort((a,b) => a.date < b.date ? 1 : -1)[0];
  const weightKg = latestWeight ? latestWeight.weight : 60;
  const kcal = Math.round((met * 3.5 * weightKg / 200) * roundedMinutes);
  previewEl.innerHTML = `${dist}km ≈ <span class="mono">${roundedMinutes}分</span>のランニング(時速${speed}km換算・約<span class="mono">${kcal}</span>kcal)`;
}
function renderTrainingFormOptions() {
  const partEl = document.getElementById("part-buttons");
  if (!partEl) return;
  partEl.innerHTML = PARTS.map(p => `<button class="chip ${selectedPart===p?"active-a":""}" data-action="select-part" data-val="${p}">${p}</button>`).join("");
  const exerciseInput = document.getElementById("exercise-input");
  const currentExercise = exerciseInput ? exerciseInput.value.trim() : "";
  const exOptions = exerciseNamesForPartByUsage(selectedPart);
  document.getElementById("exercise-buttons").innerHTML = exOptions.length
    ? exOptions.map(ex => `<button class="chip ${currentExercise===ex?"active-a":""}" data-action="select-exercise" data-val="${esc(ex)}">${esc(ex)}</button>`).join("")
    : '<span class="muted" style="font-size:11px;">未登録(設定タブの「種目マスタ」から追加できます)</span>';
  // 【重要】種目名は必ずesc()を通す。v48でマスタ登録した自分の種目名(=自由入力)が
  // この一覧に混ざるようになったため、そのまま埋め込むとHTMLとして解釈されてしまう
  // (壊れたバックアップJSONを復元したときに、記録やWorkerの合言葉を盗まれる恐れがある)。
  document.getElementById("cardio-buttons").innerHTML = cardioOptionsByUsage().map(c =>
    `<button class="chip ${selectedCardio===c?"active-b":""}" data-action="select-cardio" data-val="${esc(c)}">${esc(c)}</button>`).join("");
  document.getElementById("cardio-custom-input").classList.toggle("hidden", selectedCardio !== "その他");
  document.getElementById("housework-buttons").innerHTML = houseworkOptionsByUsage().map(c =>
    `<button class="chip ${selectedHousework===c?"active-c":""}" data-action="select-housework" data-val="${esc(c)}">${esc(c)}</button>`).join("");
  document.getElementById("housework-custom-input").classList.toggle("hidden", selectedHousework !== "その他");

  // 負荷(kg): 初回は20kgを既定値にしつつ、部位・種目に対して前回入力した
  // 回数・負荷があればそれを優先して提案する(reps-inputが空のときだけ上書きし、
  // 入力中の値は消さない)。
  const weightInput = document.getElementById("weight-input");
  const repsInput = document.getElementById("reps-input");
  if (weightInput && !weightInput.dataset.built) {
    weightInput.value = 20;
    weightInput.dataset.built = "1";
  }
  if (repsInput && (repsInput.value === "" || repsInput.dataset.autofilled === "1")) {
    const key = currentExercise || `(${selectedPart})`;
    const remembered = lastStrengthByExercise[key];
    if (remembered) {
      repsInput.value = remembered.reps;
      repsInput.dataset.autofilled = "1";
      if (weightInput) weightInput.value = remembered.weight;
    } else if (repsInput.dataset.autofilled === "1") {
      // この部位・種目には過去の記録がない。前の候補が残らないようクリアする。
      repsInput.value = "";
      delete repsInput.dataset.autofilled;
    }
  }
  const repsQuickEl = document.getElementById("reps-quick-buttons");
  if (repsQuickEl) {
    const currentReps = repsInput ? repsInput.value : "";
    repsQuickEl.innerHTML = REP_QUICK_OPTIONS.map(r =>
      `<button type="button" class="chip ${String(r)===String(currentReps)?"active-a":""}" data-action="select-reps" data-val="${r}">${r}回</button>`).join("");
  }

  // 時間(分): 有酸素の種目ごとに前回の分数を覚えておき、未入力なら提案する。
  // 筋トレの回数と同じ考え方で、自動で入れた値には印(autofilled)を付けておき、
  // 種目を切り替えたらその種目の前回値に入れ替える。自分で入力・タップした値には
  // 印が付かないので、勝手に上書きされることはない。
  const minutesInput = document.getElementById("minutes-input");
  if (minutesInput && (minutesInput.value === "" || minutesInput.dataset.autofilled === "1")) {
    const remembered = lastCardioMinutes[selectedCardio];
    if (remembered) {
      minutesInput.value = remembered;
      minutesInput.dataset.autofilled = "1";
    } else if (minutesInput.dataset.autofilled === "1") {
      // この種目には過去の記録がない。前の候補が残らないようクリアする。
      minutesInput.value = "";
      delete minutesInput.dataset.autofilled;
    }
  }
  const minutesQuickEl = document.getElementById("minutes-quick-buttons");
  if (minutesQuickEl) {
    const currentMinutes = minutesInput ? minutesInput.value : "";
    minutesQuickEl.innerHTML = MINUTE_QUICK_OPTIONS.map(m =>
      `<button type="button" class="chip ${String(m)===String(currentMinutes)?"active-b":""}" data-action="select-minutes" data-val="${m}">${m}分</button>`).join("");
  }
  updateStepsPreview();
  updateDistancePreview();

  // 家事の時間(分): 有酸素と同じ考え方で、内容ごとに前回の分数を覚えておく。
  const houseworkMinutesInput = document.getElementById("housework-minutes-input");
  if (houseworkMinutesInput && (houseworkMinutesInput.value === "" || houseworkMinutesInput.dataset.autofilled === "1")) {
    const remembered = lastHouseworkMinutes[selectedHousework];
    if (remembered) {
      houseworkMinutesInput.value = remembered;
      houseworkMinutesInput.dataset.autofilled = "1";
    } else if (houseworkMinutesInput.dataset.autofilled === "1") {
      houseworkMinutesInput.value = "";
      delete houseworkMinutesInput.dataset.autofilled;
    }
  }
  const houseworkMinutesQuickEl = document.getElementById("housework-minutes-quick-buttons");
  if (houseworkMinutesQuickEl) {
    const currentHouseworkMinutes = houseworkMinutesInput ? houseworkMinutesInput.value : "";
    houseworkMinutesQuickEl.innerHTML = MINUTE_QUICK_OPTIONS.map(m =>
      `<button type="button" class="chip ${String(m)===String(currentHouseworkMinutes)?"active-c":""}" data-action="select-housework-minutes" data-val="${m}">${m}分</button>`).join("");
  }
}

// ============ EDIT MODAL ============
function openEdit(kind, key) {
  if (kind === "training") {
    const e = entries.find(x => x.id === key);
    if (!e) return;
    editing = e.type === "strength"
      ? { kind, id: key, tempPart: e.part, draftExercise: e.exercise || "", draftReps: e.reps, draftWeight: e.weight, draftDate: e.date }
      : { kind, id: key, draftExercise: e.exercise || "", draftMinutes: e.minutes, draftDate: e.date };
  } else if (kind === "weight") {
    const w = weightEntries.find(x => x.date === key);
    if (!w) return;
    editing = { kind, date: key, draftWeight: w.weight, draftBodyFat: w.bodyFat, draftWaist: w.waist, draftDate: w.date };
  } else if (kind === "meal") {
    const m = mealEntries.find(x => x.id === key);
    if (!m) return;
    editing = { kind, id: key, tempMealType: m.mealType, draftText: m.text, draftCalories: m.calories || "", draftDate: m.date,
      draftProtein: m.protein || "", draftFat: m.fat || "", draftCarb: m.carb || "" };
  } else if (kind === "exercise-master") {
    const x = exerciseMaster.find(i => i.id === key);
    if (!x) return;
    editing = { kind, id: key, tempPart: x.part, draftName: x.name || "" };
  } else if (kind === "meal-master") {
    const m = mealMaster.find(i => i.id === key);
    if (!m) return;
    editing = { kind, id: key, draftName: m.name || "", draftCalories: m.calories || "",
      draftProtein: m.protein || "", draftFat: m.fat || "", draftCarb: m.carb || "" };
  }
  renderEditModal();
}
